<text x="820" y="365.9" font-size="13"><tspan font-weight="700">4</tspan> won't fix <tspan fill="#6b6b66">2%</tspan></text>
<text x="24" y="22" font-size="13" font-weight="600">Before each commit</text>
<text x="24" y="38" font-size="12" fill="#6b6b66">in the session that commits</text>
<path d="M24,46 L240,46" stroke="#6b6b66" stroke-width="1.5"/>
<text x="290" y="22" font-size="13" font-weight="600">Weekly judge</text>
<text x="290" y="38" font-size="12" fill="#6b6b66">unattended: checks, verifies, files the issues</text>
<path d="M290,46 L976,46" stroke="#6b6b66" stroke-width="1.5"/>
<text x="24" y="404" font-size="13" font-weight="700">From 890 notes to 615 bugs</text>
<text x="70" y="421" font-size="13" text-anchor="end" font-weight="700"> 890</text><text x="80" y="421" font-size="13">not fixed, or an untagged plausible / inferred note</text>
<text x="70" y="438" font-size="13" text-anchor="end">− 10</text><text x="80" y="438" font-size="13">wrong home: these feed only the rule count</text>
<text x="70" y="455" font-size="13" text-anchor="end">− 221</text><text x="80" y="455" font-size="13">already gone when the judge first read them: not listed</text>
<text x="70" y="472" font-size="13" text-anchor="end">− 62</text><text x="80" y="472" font-size="13">on a function another note names, or waiting on stranded commits: one bug</text>
<text x="70" y="489" font-size="13" text-anchor="end">+ 11</text><text x="80" y="489" font-size="13">tagged fixed only after the judge had listed them</text>
<text x="70" y="506" font-size="13" text-anchor="end">+ 5</text><text x="80" y="506" font-size="13">errors hit by unattended agent runs</text>
<text x="70" y="523" font-size="13" text-anchor="end">+ 2</text><text x="80" y="523" font-size="13">commits made on a PR's branch after it merged</text>
<path d="M30,530 L300,530" stroke="#6b6b66" stroke-width="1"/>
<text x="70" y="545" font-size="13" text-anchor="end" font-weight="700">= 615</text><text x="80" y="545" font-size="13">bugs in the bug check</text>
<text x="24" y="587" font-size="12" fill="#6b6b66">27 September 2026 to 10 November 2026. Each column is drawn to its own scale; the shaded band is what flows on to the next.</text>
</svg>
