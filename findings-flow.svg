<rect x="290" y="231.4" width="22" height="131.6" rx="3" fill="#CC79A7"/>
<text x="320" y="302.2" font-size="13"><tspan font-weight="700">413</tspan> to a verify agent <tspan fill="#6b6b66">53%</tspan></text>
<text x="540" y="70" font-size="16" font-weight="700">Verify agent</text>
<text x="540" y="90" font-size="13" fill="#6b6b66">413 bugs</text>
