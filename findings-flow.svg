<text x="820" y="267.0" font-size="13"><tspan font-weight="700">28</tspan> open, issue filed <tspan fill="#6b6b66">57%</tspan></text>
<rect x="790" y="334.4" width="22" height="18.4" rx="3" fill="#dedbd2"/>
<text x="820" y="348.6" font-size="13"><tspan font-weight="700">4</tspan> open, not filed yet <tspan fill="#6b6b66">8%</tspan></text>
<rect x="790" y="354.8" width="22" height="8.2" rx="3" fill="#b9b6ad"/>
<text x="820" y="365.6" font-size="13"><tspan font-weight="700">2</tspan> won't fix <tspan fill="#6b6b66">4%</tspan></text>
<text x="24" y="22" font-size="13" font-weight="600">Before each commit</text>
<text x="24" y="38" font-size="12" fill="#6b6b66">in the session that commits</text>
<path d="M24,46 L240,46" stroke="#6b6b66" stroke-width="1.5"/>
<text x="290" y="22" font-size="13" font-weight="600">Weekly judge</text>
<text x="290" y="38" font-size="12" fill="#6b6b66">unattended: checks, verifies, files the issues</text>
<path d="M290,46 L976,46" stroke="#6b6b66" stroke-width="1.5"/>
<text x="24" y="402" font-size="12" fill="#6b6b66">27 September 2026 to 16 October 2026. Each column is drawn to its own scale; the shaded band is what flows on to the next.</text>
<text x="24" y="420" font-size="12" fill="#6b6b66">Plausible notes on the same function merge into one bug. Their tag is optional: an untagged note may have been fixed in its commit, and shows here as "already gone".</text>
</svg>
