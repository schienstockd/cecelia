<rect x="540" y="195.5" width="22" height="23.4" rx="3" fill="#dedbd2"/>
<text x="570" y="212.2" font-size="13"><tspan font-weight="700">42</tspan> parked: not live yet <tspan fill="#6b6b66">10%</tspan></text>
<rect x="540" y="220.9" width="22" height="1.5" rx="3" fill="#dedbd2"/>
<text x="570" y="229.2" font-size="13"><tspan font-weight="700">5</tspan> not checked yet <tspan fill="#6b6b66">1%</tspan></text>
