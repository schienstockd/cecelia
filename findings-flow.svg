<text x="24" y="404" font-size="13" font-weight="700">From 628 notes to 382 bugs</text>
<text x="70" y="421" font-size="13" text-anchor="end" font-weight="700"> 628</text><text x="80" y="421" font-size="13">not fixed, or plausible and untagged</text>
<text x="70" y="438" font-size="13" text-anchor="end">− 9</text><text x="80" y="438" font-size="13">wrong home: these feed only the rule count</text>
<text x="70" y="455" font-size="13" text-anchor="end">− 191</text><text x="80" y="455" font-size="13">already gone when the judge first read them: not listed</text>
<text x="70" y="472" font-size="13" text-anchor="end">− 15</text><text x="80" y="472" font-size="13">logged since the last pass (27 October 2026): judged at the next</text>
<text x="70" y="489" font-size="13" text-anchor="end">− 39</text><text x="80" y="489" font-size="13">on a function another note names, or waiting on stranded commits: one bug</text>
<text x="70" y="506" font-size="13" text-anchor="end">+ 2</text><text x="80" y="506" font-size="13">tagged fixed only after the judge had listed them</text>
<text x="70" y="523" font-size="13" text-anchor="end">+ 5</text><text x="80" y="523" font-size="13">errors hit by unattended agent runs</text>
<text x="70" y="540" font-size="13" text-anchor="end">+ 1</text><text x="80" y="540" font-size="13">commits made on a PR's branch after it merged</text>
