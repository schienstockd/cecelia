<rect x="540" y="287.0" width="22" height="76.0" rx="3" fill="#CC79A7"/>
<text x="570" y="330.0" font-size="13"><tspan font-weight="700">49</tspan> real <tspan fill="#6b6b66">31%</tspan></text>
