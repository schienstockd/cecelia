<text x="70" y="562" font-size="13" text-anchor="end" font-weight="700">= 382</text><text x="80" y="562" font-size="13">bugs in the bug check</text>
<text x="24" y="604" font-size="12" fill="#6b6b66">27 September 2026 to 28 October 2026. Each column is drawn to its own scale; the shaded band is what flows on to the next.</text>
