<text x="790" y="90" font-size="13" fill="#6b6b66">49 bugs</text>
<rect x="790" y="115.0" width="22" height="74.5" rx="3" fill="#56B4E9"/>
<text x="820" y="157.3" font-size="13"><tspan font-weight="700">15</tspan> fixed <tspan fill="#6b6b66">31%</tspan></text>
