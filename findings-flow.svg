<rect x="790" y="310.7" width="22" height="49.1" rx="3" fill="#dedbd2"/>
<text x="820" y="340.2" font-size="13"><tspan font-weight="700">64</tspan> open, not filed yet <tspan fill="#6b6b66">20%</tspan></text>
<rect x="790" y="361.8" width="22" height="1.5" rx="3" fill="#b9b6ad"/>
<text x="820" y="367.4" font-size="13"><tspan font-weight="700">4</tspan> won't fix <tspan fill="#6b6b66">1%</tspan></text>
<text x="24" y="22" font-size="13" font-weight="600">Before each commit</text>
<text x="24" y="38" font-size="12" fill="#6b6b66">in the session that commits</text>
<path d="M24,46 L240,46" stroke="#6b6b66" stroke-width="1.5"/>
<text x="290" y="22" font-size="13" font-weight="600">Weekly judge</text>
<text x="290" y="38" font-size="12" fill="#6b6b66">unattended: checks, verifies, files the issues</text>
<path d="M290,46 L976,46" stroke="#6b6b66" stroke-width="1.5"/>
<text x="24" y="404" font-size="13" font-weight="700">From 1307 notes to 997 bugs</text>
<text x="70" y="421" font-size="13" text-anchor="end" font-weight="700"> 1307</text><text x="80" y="421" font-size="13">not fixed, or an untagged plausible / inferred note</text>
<text x="70" y="438" font-size="13" text-anchor="end">− 14</text><text x="80" y="438" font-size="13">wrong home: these feed only the rule count</text>
<text x="70" y="455" font-size="13" text-anchor="end">− 269</text><text x="80" y="455" font-size="13">already gone when the judge first read them: not listed</text>
<text x="70" y="472" font-size="13" text-anchor="end">− 98</text><text x="80" y="472" font-size="13">on a function another note names, or waiting on stranded commits: one bug</text>
<text x="70" y="489" font-size="13" text-anchor="end">+ 17</text><text x="80" y="489" font-size="13">tagged fixed only after the judge had listed them</text>
<text x="70" y="506" font-size="13" text-anchor="end">+ 5</text><text x="80" y="506" font-size="13">errors hit by unattended agent runs</text>
<text x="70" y="523" font-size="13" text-anchor="end">+ 2</text><text x="80" y="523" font-size="13">commits made on a PR's branch after it merged</text>
<text x="70" y="540" font-size="13" text-anchor="end">+ 47</text><text x="80" y="540" font-size="13">test gaps: changed functions whose mutants survive the tests</text>
<path d="M30,547 L300,547" stroke="#6b6b66" stroke-width="1"/>
<text x="70" y="562" font-size="13" text-anchor="end" font-weight="700">= 997</text><text x="80" y="562" font-size="13">bugs in the bug check</text>
<text x="24" y="604" font-size="12" fill="#6b6b66">27 September 2026 to 24 November 2026. Each column is drawn to its own scale; the shaded band is what flows on to the next.</text>
</svg>
