<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 603" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#2a2a2a">
