<text x="54" y="299.7" font-size="13"><tspan font-weight="700">498</tspan> plausible notes, untagged <tspan fill="#6b6b66">55%</tspan></text>
<text x="290" y="70" font-size="16" font-weight="700">Bug check</text>
<text x="290" y="90" font-size="13" fill="#6b6b66">289 bugs</text>
<rect x="290" y="115.0" width="22" height="89.7" rx="3" fill="#b9b6ad"/>
<text x="320" y="164.8" font-size="13"><tspan font-weight="700">106</tspan> already gone, or not a bug <tspan fill="#6b6b66">37%</tspan></text>
