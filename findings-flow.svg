<text x="320" y="221.9" font-size="13"><tspan font-weight="700">26</tspan> waiting (unmerged, backlog) <tspan fill="#6b6b66">9%</tspan></text>
<rect x="290" y="229.2" width="22" height="133.8" rx="3" fill="#CC79A7"/>
<text x="320" y="301.1" font-size="13"><tspan font-weight="700">157</tspan> to a verify agent <tspan fill="#6b6b66">54%</tspan></text>
<text x="540" y="70" font-size="16" font-weight="700">Verify agent</text>
<text x="540" y="90" font-size="13" fill="#6b6b66">157 bugs</text>
