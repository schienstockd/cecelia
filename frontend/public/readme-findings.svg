<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 496" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Where a pre-commit reviewer finding goes. Kept in sync with scripts/judge/bugs.py `candidates` / `swept`,
       scripts/judge/rules.py `tally` and docs/ai-assist/WEEKLY_JUDGE.md. -->
  <defs>
    <!-- a line is coloured by where it goes: vermillion into the bug check, blue into the rule count (the consoles' CVD-safe pair: never green against red) -->
    <marker id="arrowBug" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/>
    </marker>
    <marker id="arrowRule" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6b66"/>
    </marker>
  </defs>
  <rect width="900" height="496" fill="#fafaf7"/>

  <!-- gate: a finding either was fixed in its commit (down: caught, ends) or not (on); a plausible note's tag is optional -->
  <rect x="250" y="86" rx="10" ry="10" width="90" height="318" fill="#ffffff" stroke="#6b6b66" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="295" y="78" text-anchor="middle" font-size="13" fill="#6b6b66">fixed in the commit?</text>
  <text x="346" y="93" font-size="12" font-weight="700" fill="#2a2a2a">no</text>
  <path d="M295,408 L295,434" fill="none" stroke="#6b6b66" stroke-width="2" marker-end="url(#arrowDim)"/>
  <text x="302" y="425" font-size="12" font-weight="700" fill="#2a2a2a">yes</text>
  <rect x="235" y="440" rx="9" ry="9" width="120" height="36" fill="#f0f0ee" stroke="#6b6b66" stroke-width="1.5"/>
  <text x="295" y="463" text-anchor="middle" font-size="14" fill="#2a2a2a">Ends at commit</text>

  <!-- where the left column comes from -->
  <text x="16" y="30" font-size="16" fill="#2a2a2a"><tspan font-weight="700">Recital</tspan><tspan fill="#6b6b66">&#160;· before each commit</tspan></text>
  <text x="16" y="50" font-size="12" fill="#6b6b66">three reviewer agents and the mechanical checks read the diff</text>
  <path d="M16,62 L340,62" fill="none" stroke="#6b6b66" stroke-width="1.5"/>

  <!-- findings: fan-out audit (blue), convention check (yellow), result review (bluish green) -->
  <g stroke="#2a2a2a" stroke-width="3">
    <rect x="16" y="82"  rx="9" ry="9" width="200" height="38" fill="#dbeaf3"/>
    <rect x="16" y="140" rx="9" ry="9" width="200" height="38" fill="#dbeaf3"/>
    <rect x="16" y="198" rx="9" ry="9" width="200" height="38" fill="#efeecf"/>
    <rect x="16" y="256" rx="9" ry="9" width="200" height="38" fill="#efeecf"/>
    <rect x="16" y="314" rx="9" ry="9" width="200" height="38" fill="#d4ece3"/>
    <rect x="16" y="372" rx="9" ry="9" width="200" height="38" fill="#d4ece3"/>
  </g>
  <g fill="#2a2a2a" text-anchor="middle" font-size="15">
    <text x="116" y="106">Fan-out <tspan font-weight="700">plausible</tspan></text>
    <text x="116" y="164">Fan-out <tspan font-weight="700">confirmed</tspan></text>
    <text x="116" y="222">Convention <tspan font-weight="700">should reuse</tspan></text>
    <text x="116" y="280">Convention <tspan font-weight="700">wrong home</tspan></text>
    <text x="116" y="338">Result <tspan font-weight="700">reproduced</tspan></text>
    <text x="116" y="396">Result <tspan font-weight="700">inferred</tspan></text>
  </g>

  <!-- listed only: no outcome tag, never judged -->
  <rect x="16" y="436" rx="9" ry="9" width="200" height="44" fill="#f0f0ee" stroke="#6b6b66" stroke-width="1.5"/>
  <text x="116" y="454" text-anchor="middle" font-size="13" fill="#2a2a2a"><tspan font-weight="700">Potential duplicate</tspan> · <tspan font-weight="700">display</tspan></text>
  <text x="116" y="472" text-anchor="middle" font-size="13" fill="#2a2a2a">Mechanical checks</text>
  <path d="M220,458 L229,458" fill="none" stroke="#6b6b66" stroke-width="2" marker-end="url(#arrowDim)"/>

  <!-- weekly judge -->
  <g stroke="#2a2a2a" stroke-width="3">
    <rect x="500" y="148"  rx="10" ry="10" width="160" height="76" fill="#ffffff" stroke="#D55E00"/>
    <rect x="500" y="264" rx="10" ry="10" width="160" height="76" fill="#ffffff" stroke="#0072B2"/>
  </g>
  <g fill="#2a2a2a" text-anchor="middle">
    <text x="580" y="180" font-size="18" font-weight="700">Bug check</text>
    <text x="580" y="206" font-size="13" fill="#6b6b66">still on main?</text>
    <text x="580" y="296" font-size="18" font-weight="700">Rule count</text>
    <text x="580" y="322" font-size="13" fill="#6b6b66">3+ sessions?</text>
  </g>
  <path d="M675,158 Q695,158 695,178 L695,310 Q695,330 675,330" fill="none" stroke="#6b6b66" stroke-width="1.5"/>
  <text x="708" y="240" font-size="14" fill="#6b6b66">weekly judge</text>

  <!-- what happens to its output: the GitHub chain above the bug check, the proposal below the rule count -->
  <g fill="#ffffff" stroke="#2a2a2a" stroke-width="1.5">
    <rect x="500" y="72"  rx="9" ry="9" width="120" height="44"/>
    <rect x="648" y="72"  rx="9" ry="9" width="120" height="44"/>
    <rect x="796" y="72"  rx="9" ry="9" width="90"  height="44"/>
    <rect x="500" y="370" rx="9" ry="9" width="120" height="44"/>
    <rect x="648" y="370" rx="9" ry="9" width="200" height="44"/>
  </g>
  <g fill="#2a2a2a" text-anchor="middle" font-size="15">
    <text x="560" y="92">GitHub issue</text>
    <text x="708" y="92">Fix PR</text>
    <text x="841" y="92">Closed</text>
    <text x="560" y="390">Proposal</text>
    <text x="748" y="390">Rule edited, or rejected</text>
  </g>
  <g fill="#6b6b66" text-anchor="middle" font-size="11">
    <text x="560" y="108">after verify</text>
    <text x="708" y="108">Dominik or auto-fix</text>
    <text x="841" y="108">once gone</text>
    <text x="560" y="406">in a rules PR</text>
    <text x="748" y="406">Dominik, in judge-review</text>
  </g>
  <g stroke="#6b6b66" stroke-width="2" fill="none" marker-end="url(#arrowDim)">
    <path d="M560,146 L560,122" />
    <path d="M622,94 L642,94" />
    <path d="M770,94 L790,94" />
    <path d="M560,342 L560,364" />
    <path d="M622,392 L642,392" />
  </g>

  <g stroke="#D55E00" stroke-width="2.5" fill="none" marker-end="url(#arrowBug)">
    <path d="M220,101 L380,101 C440,101 440,160 495,160" />
    <path d="M220,159 L380,159 C440,159 440,176 495,176" />
    <path d="M380,217 C440,217 440,192 495,192" />
    <path d="M220,333 L380,333 C440,333 440,208 495,208" />
    <path d="M220,391 L380,391 C440,391 440,222 495,222" />
  </g>
  <g stroke="#0072B2" stroke-width="2.5" fill="none" marker-end="url(#arrowRule)">
    <path d="M380,159 C440,159 440,294 495,294" />
    <path d="M220,217 L380,217 C440,217 440,312 495,312" />
    <path d="M220,275 L330,275 C420,275 420,330 495,330" />
  </g>
  <!-- the shared stretch of a line that splits, in ink: it goes both ways -->
  <path d="M220,159 L380,159 M220,217 L380,217" fill="none" stroke="#2a2a2a" stroke-width="2.5"/>
  <text x="295" y="120" text-anchor="middle" font-size="11" fill="#6b6b66">tag optional</text>
  <text x="295" y="384" text-anchor="middle" font-size="11" fill="#6b6b66">tag optional</text>
  <g fill="#2a2a2a">
    <circle cx="380" cy="159" r="5"/>
    <circle cx="380" cy="217" r="5"/>
  </g>
</svg>
