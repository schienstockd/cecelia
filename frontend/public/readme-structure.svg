<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 448" font-family="Georgia, 'Times New Roman', serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d94a86"/></marker></defs>
<rect width="1600" height="448" fill="#fafaf7"/>
<text x="20" y="42" font-size="17" fill="#2a2a2a" text-anchor="start" xml:space="preserve" font-weight="700"><tspan>AI</tspan></text>
<text x="20" y="60" font-size="12" fill="#6b6b66" text-anchor="start" xml:space="preserve" font-style="italic"><tspan>optional</tspan></text>
<rect x="140" y="18" width="1440" height="50" rx="12" ry="12" fill="#f7d0e0" stroke="#2a2a2a" stroke-width="2.2" stroke-dasharray="7,5"/>
<text x="860" y="39" font-size="14" fill="#2a2a2a" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">Kiwi</tspan><tspan> and </tspan><tspan font-weight="700">Claude Code</tspan><tspan> read the record, QC and checks through the same readers as the app</tspan></text>
<text x="860" y="57" font-size="12" fill="#6b6b66" text-anchor="middle" xml:space="preserve" font-style="italic"><tspan>anything they write is stamped (who, model, session) · they design work, you run it · everything below works with AI off</tspan></text>
<text x="20" y="113" font-size="17" fill="#2a2a2a" text-anchor="start" xml:space="preserve" font-weight="700"><tspan>Pipeline</tspan></text>
<text x="20" y="131" font-size="12" fill="#6b6b66" text-anchor="start" xml:space="preserve" font-style="italic"><tspan>what you do</tspan></text>
<rect x="140" y="86" width="227" height="56" rx="12" ry="12" fill="#dbeaf3" stroke="#2a2a2a" stroke-width="2.2"/>
<text x="253" y="110" font-size="16" fill="#2a2a2a" text-anchor="middle" xml:space="preserve" font-weight="700"><tspan>Acquire</tspan></text>
<text x="253" y="129" font-size="12" fill="#6b6b66" text-anchor="middle" xml:space="preserve"><tspan>microscope settings</tspan></text>
<line x1="367" y1="114" x2="382" y2="114" stroke="#d94a86" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="383" y="86" width="227" height="56" rx="12" ry="12" fill="#efeecf" stroke="#2a2a2a" stroke-width="2.2"/>
<text x="496" y="110" font-size="16" fill="#2a2a2a" text-anchor="middle" xml:space="preserve" font-weight="700"><tspan>Import</tspan></text>
<text x="496" y="129" font-size="12" fill="#6b6b66" text-anchor="middle" xml:space="preserve"><tspan>calibration · units</tspan></text>
<line x1="609" y1="114" x2="624" y2="114" stroke="#d94a86" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="625" y="86" width="227" height="56" rx="12" ry="12" fill="#fbe7d4" stroke="#2a2a2a" stroke-width="2.2"/>
<text x="739" y="110" font-size="16" fill="#2a2a2a" text-anchor="middle" xml:space="preserve" font-weight="700"><tspan>Process</tspan></text>
<text x="739" y="129" font-size="12" fill="#6b6b66" text-anchor="middle" xml:space="preserve"><tspan>segment · track · correct</tspan></text>
<line x1="852" y1="114" x2="867" y2="114" stroke="#d94a86" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="868" y="86" width="227" height="56" rx="12" ry="12" fill="#dbeaf3" stroke="#2a2a2a" stroke-width="2.2"/>
<text x="981" y="110" font-size="16" fill="#2a2a2a" text-anchor="middle" xml:space="preserve" font-weight="700"><tspan>Populations</tspan></text>
<text x="981" y="129" font-size="12" fill="#6b6b66" text-anchor="middle" xml:space="preserve"><tspan>gating · clusters</tspan></text>
<line x1="1095" y1="114" x2="1110" y2="114" stroke="#d94a86" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="1111" y="86" width="227" height="56" rx="12" ry="12" fill="#efeecf" stroke="#2a2a2a" stroke-width="2.2"/>
<text x="1224" y="110" font-size="16" fill="#2a2a2a" text-anchor="middle" xml:space="preserve" font-weight="700"><tspan>Analyse</tspan></text>
<text x="1224" y="129" font-size="12" fill="#6b6b66" text-anchor="middle" xml:space="preserve"><tspan>measures · plots · statistics</tspan></text>
<line x1="1337" y1="114" x2="1352" y2="114" stroke="#d94a86" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="1353" y="86" width="227" height="56" rx="12" ry="12" fill="#fbe7d4" stroke="#2a2a2a" stroke-width="2.2"/>
<text x="1467" y="110" font-size="16" fill="#2a2a2a" text-anchor="middle" xml:space="preserve" font-weight="700"><tspan>Export</tspan></text>
<text x="1467" y="129" font-size="12" fill="#6b6b66" text-anchor="middle" xml:space="preserve"><tspan>figures · tables</tspan></text>
<rect x="383" y="152" width="1197" height="30" rx="10" ry="10" fill="#efeecf" stroke="#2a2a2a" stroke-width="2.2"/>
<text x="981" y="172" font-size="13.5" fill="#2a2a2a" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">One scheduler runs every task</tspan><tspan> · checks the params, logs the run (custom modules too)</tspan></text>
<text x="20" y="230" font-size="17" fill="#2a2a2a" text-anchor="start" xml:space="preserve" font-weight="700"><tspan>Record</tspan></text>
<text x="20" y="248" font-size="12" fill="#6b6b66" text-anchor="start" xml:space="preserve" font-style="italic"><tspan>what was done</tspan></text>
<rect x="140" y="198" width="227" height="66" rx="6" ry="6" fill="#fafaf7" stroke="#2a2a2a" stroke-width="1.4"/>
<text x="253" y="236" font-size="12.5" fill="#2a2a2a" text-anchor="middle" xml:space="preserve"><tspan>settings from the file</tspan></text>
<rect x="383" y="198" width="227" height="66" rx="6" ry="6" fill="#fafaf7" stroke="#2a2a2a" stroke-width="1.4"/>
<text x="496" y="236" font-size="12.5" fill="#2a2a2a" text-anchor="middle" xml:space="preserve"><tspan>calibration + units</tspan></text>
<rect x="625" y="198" width="227" height="66" rx="6" ry="6" fill="#fafaf7" stroke="#2a2a2a" stroke-width="1.4"/>
<text x="739" y="220" font-size="12.5" fill="#2a2a2a" text-anchor="middle" xml:space="preserve"><tspan>run log: params, status</tspan></text>
<text x="739" y="236" font-size="12.5" fill="#2a2a2a" text-anchor="middle" xml:space="preserve"><tspan>version · device · who</tspan></text>
<text x="739" y="252" font-size="12.5" fill="#2a2a2a" text-anchor="middle" xml:space="preserve"><tspan>skipped images + why</tspan></text>
<rect x="868" y="198" width="227" height="66" rx="6" ry="6" fill="#fafaf7" stroke="#2a2a2a" stroke-width="1.4"/>
<text x="981" y="236" font-size="12.5" fill="#2a2a2a" text-anchor="middle" xml:space="preserve"><tspan>gate tree, who drew it</tspan></text>
<rect x="1111" y="198" width="227" height="66" rx="6" ry="6" fill="#fafaf7" stroke="#2a2a2a" stroke-width="1.4"/>
<text x="1224" y="236" font-size="12.5" fill="#2a2a2a" text-anchor="middle" xml:space="preserve"><tspan>analysis tasks logged</tspan></text>
<rect x="1353" y="198" width="227" height="66" rx="6" ry="6" fill="#fafaf7" stroke="#2a2a2a" stroke-width="1.4"/>
<text x="1467" y="236" font-size="12.5" fill="#2a2a2a" text-anchor="middle" xml:space="preserve"><tspan>CSV rows trace back</tspan></text>
<text x="20" y="322" font-size="17" fill="#2a2a2a" text-anchor="start" xml:space="preserve" font-weight="700"><tspan>Checks</tspan></text>
<text x="20" y="340" font-size="12" fill="#6b6b66" text-anchor="start" xml:space="preserve" font-style="italic"><tspan>can it be trusted</tspan></text>
<rect x="140" y="280" width="227" height="58" rx="6" ry="6" fill="#fafaf7" stroke="#2a2a2a" stroke-width="1.4"/>
<text x="253" y="306" font-size="12.5" fill="#2a2a2a" text-anchor="middle" xml:space="preserve"><tspan>saturation · photon limit</tspan></text>
<text x="253" y="322" font-size="12.5" fill="#2a2a2a" text-anchor="middle" xml:space="preserve"><tspan>depth profile</tspan></text>
<rect x="383" y="280" width="227" height="58" rx="6" ry="6" fill="#fafaf7" stroke="#2a2a2a" stroke-width="1.4"/>
<text x="496" y="306" font-size="12.5" fill="#2a2a2a" text-anchor="middle" xml:space="preserve"><tspan>calibration · partial</tspan></text>
<text x="496" y="322" font-size="12.5" fill="#2a2a2a" text-anchor="middle" xml:space="preserve"><tspan>timepoints · pyramid</tspan></text>
<rect x="625" y="280" width="227" height="58" rx="6" ry="6" fill="#fafaf7" stroke="#2a2a2a" stroke-width="1.4"/>
<text x="739" y="306" font-size="12.5" fill="#2a2a2a" text-anchor="middle" xml:space="preserve"><tspan>QC on every run</tspan></text>
<text x="739" y="322" font-size="12.5" fill="#2a2a2a" text-anchor="middle" xml:space="preserve"><tspan>cohort QC per set</tspan></text>
<rect x="1111" y="280" width="227" height="58" rx="6" ry="6" fill="#fafaf7" stroke="#2a2a2a" stroke-width="1.4"/>
<text x="1224" y="314" font-size="12.5" fill="#2a2a2a" text-anchor="middle" xml:space="preserve"><tspan>spatial QC</tspan></text>
<rect x="1353" y="280" width="227" height="58" rx="6" ry="6" fill="#fafaf7" stroke="#2a2a2a" stroke-width="1.4"/>
<text x="1467" y="314" font-size="12.5" fill="#2a2a2a" text-anchor="middle" xml:space="preserve"><tspan>export QC</tspan></text>
<rect x="383" y="346" width="1197" height="30" rx="10" ry="10" fill="#dbeaf3" stroke="#2a2a2a" stroke-width="2.2"/>
<text x="981" y="366" font-size="13.5" fill="#2a2a2a" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">Claim checks</tspan><tspan> (rules, no model): record complete? · images treated the same? · right statistical unit?</tspan></text>
<text x="253" y="366" font-size="12" fill="#6b6b66" text-anchor="middle" xml:space="preserve" font-style="italic"><tspan>QC warns, never blocks</tspan></text>
<text x="20" y="410" font-size="17" fill="#2a2a2a" text-anchor="start" xml:space="preserve" font-weight="700"><tspan>Replay</tspan></text>
<text x="20" y="428" font-size="12" fill="#6b6b66" text-anchor="start" xml:space="preserve" font-style="italic"><tspan>run it again</tspan></text>
<rect x="383" y="396" width="1197" height="34" rx="10" ry="10" fill="#fbe7d4" stroke="#2a2a2a" stroke-width="2.2"/>
<text x="981" y="418" font-size="13.5" fill="#2a2a2a" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">Chains</tspan><tspan>: save the steps once, re-run on new images, skip what has not changed</tspan></text>
</svg>