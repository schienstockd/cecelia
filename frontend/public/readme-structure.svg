<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 482" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="arrowDim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b66"/></marker></defs>
<rect width="900" height="482" fill="#fafaf7"/>
<rect x="16" y="16" rx="10" ry="10" width="868" height="50" fill="#f3e1ec" stroke="#2a2a2a" stroke-width="2" stroke-dasharray="7 5"/>
<text x="450" y="47" font-size="16" fill="#2a2a2a" text-anchor="middle"><tspan font-weight="700">Optional AI</tspan><tspan fill="#6b6b66">&#160;· reads the same record; everything below works with it off</tspan></text>
<rect x="16" y="84" rx="10" ry="10" width="130" height="56" fill="#ffffff" stroke="#2a2a2a" stroke-width="3"/>
<text x="81" y="109" font-size="16" fill="#2a2a2a" text-anchor="middle"><tspan font-weight="700">Acquire</tspan></text>
<text x="81" y="129" font-size="12" fill="#2a2a2a" text-anchor="middle"><tspan fill="#6b6b66">microscope</tspan></text>
<path d="M148,112 L160,112" fill="none" stroke="#6b6b66" stroke-width="2" marker-end="url(#arrowDim)"/>
<rect x="164" y="84" rx="10" ry="10" width="130" height="56" fill="#ffffff" stroke="#2a2a2a" stroke-width="3"/>
<text x="229" y="109" font-size="16" fill="#2a2a2a" text-anchor="middle"><tspan font-weight="700">Import</tspan></text>
<text x="229" y="129" font-size="12" fill="#2a2a2a" text-anchor="middle"><tspan fill="#6b6b66">calibration</tspan></text>
<path d="M296,112 L308,112" fill="none" stroke="#6b6b66" stroke-width="2" marker-end="url(#arrowDim)"/>
<rect x="312" y="84" rx="10" ry="10" width="130" height="56" fill="#ffffff" stroke="#2a2a2a" stroke-width="3"/>
<text x="377" y="109" font-size="16" fill="#2a2a2a" text-anchor="middle"><tspan font-weight="700">Process</tspan></text>
<text x="377" y="129" font-size="12" fill="#2a2a2a" text-anchor="middle"><tspan fill="#6b6b66">segment · track</tspan></text>
<path d="M444,112 L456,112" fill="none" stroke="#6b6b66" stroke-width="2" marker-end="url(#arrowDim)"/>
<rect x="460" y="84" rx="10" ry="10" width="130" height="56" fill="#ffffff" stroke="#2a2a2a" stroke-width="3"/>
<text x="525" y="109" font-size="16" fill="#2a2a2a" text-anchor="middle"><tspan font-weight="700">Populations</tspan></text>
<text x="525" y="129" font-size="12" fill="#2a2a2a" text-anchor="middle"><tspan fill="#6b6b66">gating</tspan></text>
<path d="M592,112 L604,112" fill="none" stroke="#6b6b66" stroke-width="2" marker-end="url(#arrowDim)"/>
<rect x="608" y="84" rx="10" ry="10" width="130" height="56" fill="#ffffff" stroke="#2a2a2a" stroke-width="3"/>
<text x="673" y="109" font-size="16" fill="#2a2a2a" text-anchor="middle"><tspan font-weight="700">Analyse</tspan></text>
<text x="673" y="129" font-size="12" fill="#2a2a2a" text-anchor="middle"><tspan fill="#6b6b66">plots, statistics</tspan></text>
<path d="M740,112 L752,112" fill="none" stroke="#6b6b66" stroke-width="2" marker-end="url(#arrowDim)"/>
<rect x="755" y="84" rx="10" ry="10" width="128" height="56" fill="#ffffff" stroke="#2a2a2a" stroke-width="3"/>
<text x="820" y="109" font-size="16" fill="#2a2a2a" text-anchor="middle"><tspan font-weight="700">Export</tspan></text>
<text x="820" y="129" font-size="12" fill="#2a2a2a" text-anchor="middle"><tspan fill="#6b6b66">figures, tables</tspan></text>
<rect x="16" y="158" rx="10" ry="10" width="868" height="74" fill="#dbeaf3" stroke="#2a2a2a" stroke-width="3"/>
<text x="450" y="182" font-size="15" fill="#2a2a2a" text-anchor="middle"><tspan font-weight="700">Every step leaves a record</tspan><tspan fill="#6b6b66">&#160;· each run's settings, inputs, version, who and when</tspan></text>
<path d="M81,142 L81,156" fill="none" stroke="#6b6b66" stroke-width="2" marker-end="url(#arrowDim)"/>
<rect x="21" y="196" rx="7" ry="7" width="120" height="24" fill="#ffffff" stroke="#2a2a2a" stroke-width="1.5"/>
<text x="81" y="212" font-size="12" fill="#2a2a2a" text-anchor="middle"><tspan>microscope settings</tspan></text>
<path d="M229,142 L229,156" fill="none" stroke="#6b6b66" stroke-width="2" marker-end="url(#arrowDim)"/>
<rect x="169" y="196" rx="7" ry="7" width="120" height="24" fill="#ffffff" stroke="#2a2a2a" stroke-width="1.5"/>
<text x="229" y="212" font-size="12" fill="#2a2a2a" text-anchor="middle"><tspan>source fingerprint</tspan></text>
<path d="M377,142 L377,156" fill="none" stroke="#6b6b66" stroke-width="2" marker-end="url(#arrowDim)"/>
<rect x="317" y="196" rx="7" ry="7" width="120" height="24" fill="#ffffff" stroke="#2a2a2a" stroke-width="1.5"/>
<text x="377" y="212" font-size="12" fill="#2a2a2a" text-anchor="middle"><tspan>parameters, inputs</tspan></text>
<path d="M525,142 L525,156" fill="none" stroke="#6b6b66" stroke-width="2" marker-end="url(#arrowDim)"/>
<rect x="465" y="196" rx="7" ry="7" width="120" height="24" fill="#ffffff" stroke="#2a2a2a" stroke-width="1.5"/>
<text x="525" y="212" font-size="12" fill="#2a2a2a" text-anchor="middle"><tspan>gate history</tspan></text>
<path d="M673,142 L673,156" fill="none" stroke="#6b6b66" stroke-width="2" marker-end="url(#arrowDim)"/>
<rect x="613" y="196" rx="7" ry="7" width="120" height="24" fill="#ffffff" stroke="#2a2a2a" stroke-width="1.5"/>
<text x="673" y="212" font-size="12" fill="#2a2a2a" text-anchor="middle"><tspan>frozen parameters</tspan></text>
<path d="M820,142 L820,156" fill="none" stroke="#6b6b66" stroke-width="2" marker-end="url(#arrowDim)"/>
<rect x="760" y="196" rx="7" ry="7" width="120" height="24" fill="#ffffff" stroke="#2a2a2a" stroke-width="1.5"/>
<text x="820" y="212" font-size="12" fill="#2a2a2a" text-anchor="middle"><tspan>record in the file</tspan></text>
<path d="M81,234 C81,264 339,260 339,288" fill="none" stroke="#6b6b66" stroke-width="2" marker-end="url(#arrowDim)"/>
<path d="M229,234 C229,264 384,260 384,288" fill="none" stroke="#6b6b66" stroke-width="2" marker-end="url(#arrowDim)"/>
<path d="M377,234 C377,264 428,260 428,288" fill="none" stroke="#6b6b66" stroke-width="2" marker-end="url(#arrowDim)"/>
<path d="M525,234 C525,264 472,260 472,288" fill="none" stroke="#6b6b66" stroke-width="2" marker-end="url(#arrowDim)"/>
<path d="M673,234 C673,264 517,260 517,288" fill="none" stroke="#6b6b66" stroke-width="2" marker-end="url(#arrowDim)"/>
<path d="M820,234 C820,264 561,260 561,288" fill="none" stroke="#6b6b66" stroke-width="2" marker-end="url(#arrowDim)"/>
<rect x="16" y="294" rx="10" ry="10" width="868" height="104" fill="#efeecf" stroke="#2a2a2a" stroke-width="3"/>
<text x="450" y="324" font-size="16" fill="#2a2a2a" text-anchor="middle"><tspan font-weight="700">Checks read the record</tspan><tspan fill="#6b6b66">&#160;· they warn and say what to do, never block</tspan></text>
<text x="450" y="352" font-size="14" fill="#2a2a2a" text-anchor="middle"><tspan fill="#6b6b66">at each step:&#160;</tspan><tspan>saturation · calibration · drift, counts, tracks · gates · statistics</tspan></text>
<text x="450" y="378" font-size="14" fill="#2a2a2a" text-anchor="middle"><tspan fill="#6b6b66">claims from a plot, e.g.&#160;</tspan><tspan font-style="italic">“T cells move faster than B cells”</tspan><tspan fill="#6b6b66">: were both processed the same way?</tspan></text>
<rect x="16" y="416" rx="10" ry="10" width="868" height="50" fill="#d4ece3" stroke="#2a2a2a" stroke-width="3"/>
<text x="450" y="447" font-size="16" fill="#2a2a2a" text-anchor="middle"><tspan font-weight="700">Chains replay it</tspan><tspan fill="#6b6b66">&#160;· the same steps on new images, or a past run exactly</tspan></text>
</svg>
