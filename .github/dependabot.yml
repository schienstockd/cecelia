# Dependabot version updates: npm + GitHub Actions only. Pixi and Julia are refreshed by
# `.github/workflows/update-deps.yml` instead — Dependabot cannot read pixi.lock, and the three Julia
# manifests path-source each other so they must resolve together. See docs/todo/DEPS_UPDATES_PLAN.md.
#
# Monthly + grouped because every PR runs the full 3-OS CI matrix (torch included). Minor + patch
# land as one PR per ecosystem; majors stay individual so one breaking upgrade doesn't block the rest.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    # primeicons 8 moved from MIT to the proprietary, key-gated PrimeUI License (with PrimeVue 5,
    # which is already gone). Frozen at 7.0.0, its last MIT release (exact pin in package.json),
    # until the icon swap — docs/todo/PRIMEVUE_RETIRE_PLAN.md P4. ALL updates are ignored: any new
    # release, patches included, could ship under the new licence.
    ignore:
      - dependency-name: primeicons
      # TypeScript 7 is the native (Go) rewrite and drops `typescript/lib/tsc`, which vue-tsc loads
      # (#1360 failed every typecheck). Majors stay ignored until vue-tsc supports 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
