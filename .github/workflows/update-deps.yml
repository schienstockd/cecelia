name: Update lockfiles

# Monthly refresh of pixi.lock and the three Julia manifests (app, api, pluto), opened as ONE PR on
# branch `update-deps`. Versions move only within the ranges in pixi.toml and [compat]. Raising a
# range is a manual edit. npm and Actions are on Dependabot (.github/dependabot.yml), which can't
# read pixi.lock and would split the path-sourced Julia envs. See docs/todo/DEPS_UPDATES_PLAN.md.
#
# CI on the PR: a PR opened with GITHUB_TOKEN starts its `pull_request` runs in an
# approval-required state. Approve them from the PR banner. No PAT is needed.
#
# Needs Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 1 * *"   # 05:00 UTC on the 1st

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Same pixi version as ci.yml, so the lock this writes is one CI can read. Bump both together.
      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: v0.71.1
          run-install: false

      - name: Install Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'

      # No `--no-install`: the PyPI deps need an installed env to solve against.
      - name: Update pixi.lock
        run: |
          set -o pipefail
          pixi update --json | pixi exec pixi-diff-to-markdown > pixi-diff.md

      # Plain julia, not `pixi run`: the script only needs Pkg + TOML, not the analysis env.
      - name: Update Julia manifests
        run: julia --startup-file=no scripts/update_julia_envs.jl > julia-diff.md

      # Review items go at the top. pixi-diff-to-markdown collapses its tables, so pull the explicit-dep
      # rows that need a careful look out of them: majors, downgrades, and 0.x minor bumps (breaking
      # by semver, though the tool labels them "Minor"). The Julia script puts its own flags first.
      - name: Assemble PR body
        run: |
          awk -F'|' '/<summary>Explicit/{e=1} /<summary>Implicit/{e=0}
                     e && ($5 ~ /Major|Downgrade/ || ($5 == "Minor Upgrade" && $3 ~ /^0\./))' \
            pixi-diff.md > pixi-review.md
          {
            echo "Monthly lockfile refresh within the ranges in \`pixi.toml\` and Julia \`[compat]\`. Generated by \`.github/workflows/update-deps.yml\`."
            echo
            echo "CI starts in an approval-required state. Approve it from the banner above. If a major breaks CI, see \`docs/DEV.md\` → *Dependency updates* before pushing fixes here: this branch is force-pushed every month."
            echo
            echo "## Review first — pixi: majors, downgrades, 0.x minors (direct deps)"
            echo
            if [ -s pixi-review.md ]; then
              echo "|Dependency|Before|After|Change|Environments|"
              echo "|-|-|-|-|-|"
              cat pixi-review.md
            else
              echo "None."
            fi
            echo
            echo "## Held back — pixi caps and pins (a refresh never moves these; is each still needed?)"
            echo
            grep -E '^[A-Za-z0-9_.-]+ *= *"[^"]*(<|\*)' pixi.toml | sed 's/^/- `/; s/$/`/'
            echo
            cat julia-diff.md
            echo
            cat pixi-diff.md
          } > pr-body.md

      - name: Open PR
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(deps): refresh pixi.lock and Julia manifests"
          title: "chore(deps): refresh pixi.lock and Julia manifests"
          body-path: pr-body.md
          branch: update-deps
          delete-branch: true
          labels: dependencies
          add-paths: |
            pixi.lock
            app/Manifest.toml
            api/Manifest.toml
            pluto/Manifest.toml
