name: Release

# On a version tag (v*), build the frontend, package a portable bundle (prebuilt frontend
# included, so running needs no Node), and publish a GitHub Release with the bundle + the install
# scripts as assets. The install scripts then bootstrap Pixi + Juliaup on the user's machine and
# provision the env there.
#
# One job is enough: the bundle is OS-independent (Julia + the Python env are provisioned per-OS
# at install time by juliaup/pixi). Only the install *script* differs per OS (install.sh /
# install.ps1). See docs/SHIPPING.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the Release and upload assets

jobs:
  release:
    name: Build bundle + publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # `git describe` needs the tag history to find the PREVIOUS tag for the compare link
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build frontend (shipped prebuilt in the bundle)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # bioformats2raw (~190 MB) is NOT bundled — install.sh/install.ps1 fetch the latest release
      # into <install>/bioformats2raw at install time (keeps the bundle ~6 MB). See docs/SHIPPING.md.
      - name: Package portable bundle
        run: |
          mkdir -p out
          echo "${{ github.ref_name }}" > VERSION   # so the installed app knows its version
          # This list is an ALLOW-list, so anything not named here is silently absent from every
          # stable install while the dev channel (a full branch archive) stays fine — the failure
          # never shows up in development. #540 was exactly that: `pluto/` was missing and
          # `api/src/notebooks_api.jl` includes `pluto/sysimage_stamp.jl` at server load, so every
          # v0.1.1 install died on first launch. `preview/` and `mcp/` were missing too and fail
          # quieter still (no preview worker to spawn; an observer registered against a directory
          # that isn't there). Before removing anything here, check the `release bundle ships every
          # runtime path` testset in app/test/suite.jl, which pins the load-bearing ones.
          tar -czf out/cecelia.tar.gz \
            api app pluto preview mcp python scripts app.py pixi.toml pixi.lock VERSION \
            napari/napari_bridge.py frontend/dist \
            install.sh install.ps1 README.md LICENSE THIRD_PARTY.md docs
          # SHA-256 beside the bundle, so the in-app updater and the installers can verify what they
          # downloaded. `cd out` first: sha256sum records the path it was GIVEN, and a digest naming
          # `out/cecelia.tar.gz` would not match a file downloaded as `cecelia.tar.gz`.
          cd out && sha256sum cecelia.tar.gz > cecelia.tar.gz.sha256 && cd ..
          cat out/cecelia.tar.gz.sha256
          ls -lh out/

      # The release body is the CHANGELOG section for this tag, NOT GitHub's auto-generated PR list.
      # That list is also what the in-app What's New modal renders (the update check passes the body
      # through as markdown), and 450 lines of `* title by @user in #N` told a user nothing they could
      # act on. A missing section FAILS here rather than publishing an empty release — see
      # docs/RELEASING.md, and scripts/changelogSection.mjs for the extractor + why.
      - name: Release notes from CHANGELOG
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # the tag before this one, for the compare link; empty on the very first release
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || true)
          echo "previous tag: ${PREVIOUS_TAG:-<none>}"
          PREVIOUS_TAG="$PREVIOUS_TAG" node scripts/changelogSection.mjs "${{ github.ref_name }}" \
            > RELEASE_NOTES.md
          echo "--- release body ---"
          cat RELEASE_NOTES.md

      - name: Publish GitHub Release
        # v3 = the same action on the Node 24 runtime (v3.0.0 was runtime-only; `v2` is pinned to
        # the 2.x line and still declares node20, which GitHub now force-runs on 24 with a
        # deprecation warning). Inputs below are unchanged between the two majors.
        uses: softprops/action-gh-release@v3
        with:
          files: |
            out/cecelia.tar.gz
            out/cecelia.tar.gz.sha256
            install.sh
            install.ps1
          # The CHANGELOG section is the body (see the step above). `generate_release_notes` would
          # APPEND the PR list underneath it, which is the thing being removed.
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          # Tags with a pre-release suffix (e.g. v0.1.0-rc1) publish as a GitHub prerelease;
          # clean vX.Y.Z tags publish as a full release (and become the `latest` the one-liner uses).
          prerelease: ${{ contains(github.ref_name, '-') }}
