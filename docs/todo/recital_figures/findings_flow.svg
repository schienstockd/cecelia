<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1010" viewBox="0 0 1800 1010" font-family="Helvetica, Arial, DejaVu Sans, sans-serif">
  <defs>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b6964"/></marker>
  </defs>
  <rect width="1800" height="1010" fill="#f9f8f4"/>
  <text x="32" y="60" font-size="32" fill="#222"><tspan font-weight="700">Claim recital</tspan><tspan fill="#666"> · when a claim is stated</tspan></text>
  <text x="32" y="100" font-size="21" fill="#666">mechanical Checks and one Review read the claim + record; a Translator parses the claim first</text>
  <line x1="32" y1="124" x2="680" y2="124" stroke="#6b6964" stroke-width="2"/>

  <!-- legend of sources -->
  <g font-size="15" fill="#555">
    <rect x="1010" y="40" width="22" height="16" rx="3" fill="#dde9f2" stroke="#222" stroke-width="2"/><text x="1040" y="54">Checks (code) — gives the verdict</text>
    <rect x="1010" y="66" width="22" height="16" rx="3" fill="#f2e1ea" stroke="#222" stroke-width="2"/><text x="1040" y="80">Review (model) — advisory only</text>
    <rect x="1340" y="40" width="22" height="16" rx="3" fill="#f0f0ee" stroke="#666" stroke-width="2"/><text x="1370" y="54">Translator (model) — not a finding</text>
  </g>

  <!-- gate -->
  <text x="590" y="150" font-size="21" fill="#555" text-anchor="middle">fixed in the analysis?</text>
  <rect x="500" y="172" width="180" height="636" rx="14" fill="none" stroke="#777" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="706" y="186" font-size="20" font-weight="700" fill="#222">no</text>
  <text x="590" y="760" font-size="15" fill="#666" text-anchor="middle">tag optional</text>
  <text x="590" y="236" font-size="14" fill="#D55E00" text-anchor="middle">rewording the claim</text>
  <text x="590" y="254" font-size="14" fill="#D55E00" text-anchor="middle">is a new round,</text>
  <text x="590" y="272" font-size="14" fill="#D55E00" text-anchor="middle">not "fixed"</text>

  <!-- left boxes -->
  <g font-size="26" text-anchor="middle" fill="#222">
    <rect x="32" y="162" width="400" height="76" rx="12" fill="#dde9f2" stroke="#222" stroke-width="5"/><text x="232" y="210">Record <tspan font-weight="700">gap</tspan></text>
    <rect x="32" y="278" width="400" height="76" rx="12" fill="#dde9f2" stroke="#222" stroke-width="5"/><text x="232" y="326"><tspan font-weight="700">Inconsistent</tspan> images</text>
    <rect x="32" y="394" width="400" height="76" rx="12" fill="#dde9f2" stroke="#222" stroke-width="5"/><text x="232" y="442">Convention <tspan font-weight="700">broken</tspan></text>
    <rect x="32" y="510" width="400" height="76" rx="12" fill="#dde9f2" stroke="#222" stroke-width="5"/><text x="232" y="558">Claim <tspan font-weight="700">reproduced</tspan></text>
    <rect x="32" y="626" width="400" height="76" rx="12" fill="#f2e1ea" stroke="#222" stroke-width="5"/><text x="232" y="674">Review <tspan font-weight="700">inferred</tspan></text>
  </g>
  <g font-size="14" fill="#666">
    <text x="440" y="252">S0</text><text x="440" y="368">S1</text><text x="440" y="484">S2 rules</text><text x="440" y="600">S3b</text>
  </g>

  <!-- flows: orange to Claim check, blue to Rule count -->
  <g fill="none" stroke-width="4">
    <!-- 1 record gap: orange + blue -->
    <path d="M440,200 L760,200" stroke="#222"/>
    <path d="M760,200 C880,200 880,322 993,322" stroke="#D55E00" marker-end="url(#o)"/>
    <path d="M760,200 C900,200 860,586 993,586" stroke="#0072B2" marker-end="url(#b)"/>
    <!-- 2 inconsistent: orange -->
    <path d="M440,316 L680,316 C840,316 840,354 993,354" stroke="#D55E00" marker-end="url(#o)"/>
    <!-- 3 convention: orange + blue -->
    <path d="M440,432 L760,432" stroke="#222"/>
    <path d="M760,432 C880,432 880,386 993,386" stroke="#D55E00" marker-end="url(#o)"/>
    <path d="M760,432 C880,432 860,620 993,620" stroke="#0072B2" marker-end="url(#b)"/>
    <!-- 4 reproduced: orange -->
    <path d="M440,548 L680,548 C860,548 840,418 993,418" stroke="#D55E00" marker-end="url(#o)"/>
    <!-- 5 review inferred: orange + blue (ratchet) -->
    <path d="M440,664 L760,664" stroke="#222"/>
    <path d="M760,664 C890,664 860,446 993,446" stroke="#D55E00" marker-end="url(#o)"/>
    <path d="M760,664 C880,664 880,654 993,654" stroke="#0072B2" marker-end="url(#b)"/>
  </g>
  <g fill="#222"><circle cx="760" cy="200" r="9"/><circle cx="760" cy="432" r="9"/><circle cx="760" cy="664" r="9"/></g>

  <!-- yes -> ends -->
  <line x1="590" y1="818" x2="590" y2="868" stroke="#6b6964" stroke-width="4" marker-end="url(#g)"/>
  <text x="606" y="850" font-size="20" font-weight="700" fill="#222">yes</text>
  <rect x="32" y="874" width="400" height="88" rx="12" fill="#f0f0ee" stroke="#666" stroke-width="3"/>
  <text x="232" y="908" font-size="22" text-anchor="middle" fill="#222"><tspan font-weight="700">Within tolerance</tspan> · display</text>
  <text x="232" y="940" font-size="20" text-anchor="middle" fill="#222">Translator output</text>
  <path d="M440,918 L462,918" stroke="#6b6964" stroke-width="4" marker-end="url(#g)"/>
  <rect x="470" y="880" width="240" height="72" rx="12" fill="#f0f0ee" stroke="#666" stroke-width="3"/>
  <text x="590" y="914" font-size="22" text-anchor="middle" fill="#222">Ends at the stamp</text>
  <text x="590" y="940" font-size="15" text-anchor="middle" fill="#666">on the export</text>

  <!-- sinks -->
  <rect x="1000" y="296" width="320" height="170" rx="16" fill="#fff" stroke="#D55E00" stroke-width="5"/>
  <text x="1160" y="356" font-size="32" font-weight="700" text-anchor="middle" fill="#222">Claim check</text>
  <text x="1160" y="400" font-size="21" text-anchor="middle" fill="#555">still applies to the</text>
  <text x="1160" y="426" font-size="21" text-anchor="middle" fill="#555">current record?</text>

  <rect x="1000" y="540" width="320" height="150" rx="16" fill="#fff" stroke="#0072B2" stroke-width="5"/>
  <text x="1160" y="598" font-size="32" font-weight="700" text-anchor="middle" fill="#222">Rule count</text>
  <text x="1160" y="640" font-size="21" text-anchor="middle" fill="#555">3+ claims?</text>

  <!-- brackets -->
  <path d="M1350,300 Q1388,300 1388,330 L1388,440 Q1388,462 1350,462" fill="none" stroke="#777" stroke-width="2"/>
  <text x="1404" y="372" font-size="20" fill="#666">per project, at the</text>
  <text x="1404" y="398" font-size="20" fill="#666">next session briefing</text>
  <path d="M1350,544 Q1388,544 1388,570 L1388,664 Q1388,686 1350,686" fill="none" stroke="#777" stroke-width="2"/>
  <text x="1404" y="604" font-size="20" fill="#D55E00">across claims and</text>
  <text x="1404" y="630" font-size="20" fill="#D55E00">projects — open: who</text>
  <text x="1404" y="656" font-size="20" fill="#D55E00">sees them all?</text>

  <!-- top chain -->
  <line x1="1120" y1="290" x2="1120" y2="244" stroke="#6b6964" stroke-width="4" marker-end="url(#g)"/>
  <rect x="1000" y="144" width="240" height="90" rx="12" fill="#fff" stroke="#222" stroke-width="3"/>
  <text x="1120" y="182" font-size="24" text-anchor="middle" fill="#222">Briefing item</text>
  <text x="1120" y="212" font-size="17" text-anchor="middle" fill="#666">Kiwi / Claude Code</text>
  <line x1="1246" y1="189" x2="1286" y2="189" stroke="#6b6964" stroke-width="4" marker-end="url(#g)"/>
  <rect x="1296" y="144" width="240" height="90" rx="12" fill="#fff" stroke="#222" stroke-width="3"/>
  <text x="1416" y="182" font-size="24" text-anchor="middle" fill="#222">Analyst acts</text>
  <text x="1416" y="212" font-size="17" text-anchor="middle" fill="#666">re-analyse or retract</text>
  <line x1="1542" y1="189" x2="1582" y2="189" stroke="#6b6964" stroke-width="4" marker-end="url(#g)"/>
  <rect x="1592" y="144" width="180" height="90" rx="12" fill="#fff" stroke="#222" stroke-width="3"/>
  <text x="1682" y="182" font-size="24" text-anchor="middle" fill="#222">Closed</text>
  <text x="1682" y="212" font-size="17" text-anchor="middle" fill="#666">once gone</text>

  <!-- bottom chain -->
  <line x1="1120" y1="696" x2="1120" y2="734" stroke="#6b6964" stroke-width="4" marker-end="url(#g)"/>
  <rect x="1000" y="740" width="270" height="90" rx="12" fill="#fff" stroke="#222" stroke-width="3"/>
  <text x="1135" y="778" font-size="24" text-anchor="middle" fill="#222">Proposal</text>
  <text x="1135" y="808" font-size="17" text-anchor="middle" fill="#666">new Check rule, or an app fix</text>
  <line x1="1276" y1="785" x2="1316" y2="785" stroke="#6b6964" stroke-width="4" marker-end="url(#g)"/>
  <rect x="1326" y="740" width="400" height="90" rx="12" fill="#fff" stroke="#222" stroke-width="3"/>
  <text x="1526" y="778" font-size="24" text-anchor="middle" fill="#222">Rule added, or rejected</text>
  <text x="1526" y="808" font-size="17" text-anchor="middle" fill="#666">Dominik, in a rules PR</text>

  <text x="1000" y="880" font-size="16" fill="#666">A recurring <tspan font-weight="700">record gap</tspan> is a Cecelia bug (a task that doesn't bank its params) → app fix.</text>
  <text x="1000" y="904" font-size="16" fill="#666">A recurring <tspan font-weight="700">Review inferred</tspan> becomes a Check rule: how the mechanical layer grows.</text>
  <text x="1000" y="928" font-size="16" fill="#666">A recurring <tspan font-weight="700">convention</tspan> finding sharpens the S2 rule or its threshold.</text>
  <text x="32" y="992" font-size="14" fill="#888">Draft 2026-11-05, same layout as the dev recital flow. Orange text = open point. No data yet.</text>
</svg>
