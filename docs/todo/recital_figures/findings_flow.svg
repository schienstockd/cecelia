<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="810" viewBox="0 0 1600 810" font-family="Helvetica, Arial, DejaVu Sans, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a877f"/></marker>
  </defs>
  <rect width="1600" height="810" fill="#f9f8f4"/>

  <text x="48" y="44" font-size="24" font-weight="700" fill="#222">Claim recital — as built</text>
  <text x="48" y="70" font-size="15" fill="#777">Checks state facts · a model review adds what checks can't see · the analyst marks the review. A helper, not a gate. Orange = open point.</text>

  <!-- lane 1 -->
  <text x="48" y="118" font-size="17" font-weight="700" fill="#222">When the claim is stated</text>
  <text x="48" y="138" font-size="14" fill="#777">checks at once and on every visit · the review on request</text>
  <line x1="48" y1="150" x2="1552" y2="150" stroke="#8a877f" stroke-width="2"/>

  <!-- Claim -->
  <rect x="48" y="176" width="250" height="250" rx="4" fill="#fff" stroke="#dfddd6"/>
  <rect x="48" y="176" width="10" height="250" fill="#0072B2"/>
  <text x="72" y="204" font-size="18" font-weight="700" fill="#222">Claim</text>
  <text x="72" y="226" font-size="13" fill="#777">a summary plot's footer button</text>
  <text x="72" y="258" font-size="14" fill="#333">one sentence</text>
  <text x="72" y="278" font-size="14" fill="#333">+ scope from the plot:</text>
  <text x="72" y="298" font-size="14" fill="#333">set · populations · measure</text>
  <text x="72" y="330" font-size="14" fill="#333"><tspan font-weight="700">Replicate</tspan> = image attributes</text>
  <text x="72" y="350" font-size="14" fill="#333">(Mouse, or Mouse × Location)</text>
  <text x="72" y="408" font-size="13" fill="#CC79A7" font-weight="700">only the review reads the sentence</text>

  <line x1="298" y1="300" x2="336" y2="300" stroke="#8a877f" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Checks -->
  <rect x="340" y="176" width="340" height="250" rx="4" fill="#fff" stroke="#dfddd6"/>
  <rect x="340" y="176" width="10" height="250" fill="#56B4E9"/>
  <text x="364" y="204" font-size="18" font-weight="700" fill="#222">Checks <tspan font-size="14" font-weight="400" fill="#777">code · no model</tspan></text>
  <text x="364" y="240" font-size="14" fill="#333"><tspan font-weight="700">Images</tspan>  in the set, with data</text>
  <text x="364" y="264" font-size="14" fill="#333"><tspan font-weight="700">Processing record</tspan>  params, 2D/3D</text>
  <text x="364" y="288" font-size="14" fill="#333"><tspan font-weight="700">Same processing</tspan>  across images</text>
  <text x="364" y="312" font-size="14" fill="#333"><tspan font-weight="700">Replicates</tspan>  n, rank-test floor</text>
  <text x="364" y="336" font-size="14" fill="#333"><tspan font-weight="700">Units</tspan>  calibrated</text>
  <text x="364" y="380" font-size="14" fill="#333">✓ fact  ·  ⚠ fact → what to do</text>
  <text x="364" y="408" font-size="13" fill="#777">plain lines, nothing to mark</text>

  <line x1="680" y1="300" x2="718" y2="300" stroke="#8a877f" stroke-width="2" marker-end="url(#ar)"/>
  <text x="699" y="290" font-size="11" fill="#777" text-anchor="middle">told</text>

  <!-- Model review -->
  <rect x="722" y="176" width="400" height="250" rx="4" fill="#fff" stroke="#dfddd6"/>
  <rect x="722" y="176" width="10" height="250" fill="#CC79A7"/>
  <text x="746" y="204" font-size="18" font-weight="700" fill="#222">Model review <tspan font-size="14" font-weight="400" fill="#777">one Kiwi turn · ~1 min</tspan></text>
  <text x="746" y="240" font-size="14" fill="#333">reads the record through an allow-list,</text>
  <text x="746" y="260" font-size="14" fill="#333">not your notes, Blackboard or ELN</text>
  <text x="746" y="294" font-size="14" fill="#333">adds only what the checks miss:</text>
  <text x="746" y="314" font-size="14" fill="#333"><tspan font-weight="700">what, where → what to do</tspan>, with refs</text>
  <text x="746" y="346" font-size="14" fill="#333">+ <tspan font-weight="700">The data</tspan> · <tspan font-weight="700">What the record would support</tspan></text>
  <text x="746" y="408" font-size="13" fill="#777">advisory · a failed run says why</text>

  <line x1="1122" y1="300" x2="1160" y2="300" stroke="#8a877f" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Claim entry -->
  <rect x="1164" y="176" width="388" height="250" rx="4" fill="#fff" stroke="#dfddd6"/>
  <rect x="1164" y="176" width="10" height="250" fill="#E69F00"/>
  <text x="1188" y="204" font-size="18" font-weight="700" fill="#222">Claim entry <tspan font-size="14" font-weight="400" fill="#777">on the Blackboard</tspan></text>
  <text x="1188" y="240" font-size="14" fill="#333">checks and review points, by category;</text>
  <text x="1188" y="260" font-size="14" fill="#333">the plot's popover shows the same</text>
  <rect x="1188" y="280" width="96" height="32" rx="3" fill="#56B4E9"/><text x="1236" y="301" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">Good</text>
  <rect x="1292" y="280" width="96" height="32" rx="3" fill="#E69F00"/><text x="1340" y="301" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">Bad</text>
  <rect x="1396" y="280" width="96" height="32" rx="3" fill="#b8b5ae"/><text x="1444" y="301" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">Unsure</text>
  <text x="1188" y="334" font-size="13" fill="#777">on the review's points only</text>
  <text x="1188" y="364" font-size="14" fill="#333">restate → a new round, earlier ones kept</text>
  <text x="1188" y="390" font-size="13" fill="#E69F00">open: point ids follow the wording,</text>
  <text x="1188" y="408" font-size="13" fill="#E69F00">so a reworded point loses its mark</text>

  <!-- lane 2 -->
  <text x="48" y="478" font-size="17" font-weight="700" fill="#222">After a finding</text>
  <text x="48" y="498" font-size="14" fill="#777">closed by the record, never by a tag</text>
  <line x1="48" y1="510" x2="1122" y2="510" stroke="#8a877f" stroke-width="2"/>
  <line x1="1164" y1="510" x2="1552" y2="510" stroke="#b8b5ae" stroke-width="2" stroke-dasharray="6 4"/>

  <rect x="48" y="536" width="340" height="110" rx="4" fill="#fff" stroke="#dfddd6"/>
  <rect x="48" y="536" width="10" height="110" fill="#56B4E9"/>
  <text x="72" y="564" font-size="18" font-weight="700" fill="#222">Re-check</text>
  <text x="72" y="594" font-size="14" fill="#333">on every visit, and in the session</text>
  <text x="72" y="614" font-size="14" fill="#333">briefing for Kiwi and Claude Code</text>

  <line x1="388" y1="591" x2="426" y2="591" stroke="#8a877f" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="430" y="536" width="340" height="110" rx="4" fill="#fff" stroke="#dfddd6"/>
  <rect x="430" y="536" width="10" height="110" fill="#E69F00"/>
  <text x="454" y="564" font-size="18" font-weight="700" fill="#222">Analyst acts</text>
  <text x="454" y="594" font-size="14" fill="#333">re-analyse, restate, or retract</text>

  <line x1="770" y1="591" x2="808" y2="591" stroke="#8a877f" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="812" y="536" width="310" height="110" rx="4" fill="#fff" stroke="#dfddd6"/>
  <rect x="812" y="536" width="10" height="110" fill="#b8b5ae"/>
  <text x="836" y="564" font-size="18" font-weight="700" fill="#222">Closed</text>
  <text x="836" y="594" font-size="14" fill="#333">when the re-check no longer</text>
  <text x="836" y="614" font-size="14" fill="#333">finds it</text>

  <!-- not built -->
  <rect x="1164" y="536" width="388" height="110" rx="4" fill="none" stroke="#b8b5ae" stroke-dasharray="6 4"/>
  <text x="1188" y="564" font-size="18" font-weight="700" fill="#999">Not built yet</text>
  <text x="1188" y="590" font-size="13" fill="#999">findings drawn on the plot's dots · export stamp</text>
  <text x="1188" y="608" font-size="13" fill="#999">review points in the briefing</text>
  <text x="1188" y="626" font-size="13" fill="#999">claims between treatment arms</text>

  <!-- bottom notes -->
  <text x="48" y="694" font-size="14" fill="#999"><tspan font-weight="700">Parked:</tspan> rule count (a finding on 3+ claims → a new rule or an app fix) · a model that parses the sentence · fixed perturbation sets · CONFIRM-style gates</text>
  <text x="48" y="720" font-size="14" fill="#E69F00">open: the review prompt still lists what the 4kS67f hand-walk found · no held-out project with treatment arms to test on</text>

  <text x="48" y="776" font-size="13" fill="#999">v3 2026-11-08, as built after #1969–#2036 and live runs on 4kS67f. v2 (2026-11-06, the design before building) and v1 (2026-11-05) are in git history.</text>
</svg>
