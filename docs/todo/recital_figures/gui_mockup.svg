<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" font-family="Inter, DejaVu Sans, sans-serif">
  <rect width="1440" height="860" fill="#0f1117"/>
  <text x="32" y="40" fill="#e6edf3" font-size="20" font-weight="600">Claim recital in the GUI — mockup (brainstorm, illustrative values)</text>
  <text x="32" y="64" fill="#7d8590" font-size="13">Cheap checks run when the claim is stated · the model review runs on request · export carries a stamp, never blocks</text>

  <!-- Analysis board -->
  <rect x="32" y="88" width="900" height="610" rx="8" fill="#161b22" stroke="#21262d"/>
  <text x="52" y="116" fill="#7d8590" font-size="12">ANALYSIS BOARD · 4kS67f · set "B and T"</text>
  <rect x="52" y="130" width="860" height="550" rx="6" fill="#0f1117" stroke="#21262d"/>
  <text x="72" y="158" fill="#e6edf3" font-size="15" font-weight="600">Track speed (µm/min) by population</text>
  <text x="880" y="158" fill="#7d8590" font-size="16" text-anchor="end">⋯</text>

  <!-- claim strip -->
  <rect x="72" y="172" width="820" height="78" rx="6" fill="#2d1b69" stroke="#7c3aed"/>
  <text x="88" y="196" fill="#c4b5fd" font-size="12">CLAIM  (scope taken from this plot: 7 images · pops B/_tracked, T/_tracked · live.track.speed)</text>
  <text x="88" y="222" fill="#e6edf3" font-size="16" font-weight="600">“T cells move faster than B cells”</text>
  <!-- chips -->
  <g font-size="12">
    <rect x="88" y="230" width="0" height="0"/>
  </g>
  <g transform="translate(398,206)" font-size="12">
    <rect x="0" y="0" width="92" height="26" rx="13" fill="#21262d"/><circle cx="14" cy="13" r="5" fill="#E69F00"/><text x="26" y="17" fill="#e6edf3">Record 2</text>
    <rect x="100" y="0" width="118" height="26" rx="13" fill="#21262d"/><circle cx="114" cy="13" r="5" fill="#56B4E9"/><text x="126" y="17" fill="#e6edf3">Consistency ✓</text>
    <rect x="226" y="0" width="112" height="26" rx="13" fill="#21262d"/><circle cx="240" cy="13" r="5" fill="#56B4E9"/><text x="252" y="17" fill="#e6edf3">Conventions ✓</text>
  </g>
  <rect x="760" y="206" width="120" height="26" rx="5" fill="#7659cf"/><text x="820" y="223" fill="#ffffff" font-size="12" text-anchor="middle">Check claim · ~$1</text>

  <!-- plot axes -->
  <line x1="140" y1="290" x2="140" y2="620" stroke="#7d8590"/>
  <line x1="140" y1="620" x2="860" y2="620" stroke="#7d8590"/>
  <g fill="#7d8590" font-size="11" text-anchor="end">
    <text x="132" y="624">0</text><text x="132" y="514">4</text><text x="132" y="404">8</text><text x="132" y="294">12</text>
  </g>
  <text x="96" y="460" fill="#7d8590" font-size="11" transform="rotate(-90 96 460)" text-anchor="middle">median track speed per image</text>
  <text x="330" y="642" fill="#e6edf3" font-size="13" text-anchor="middle">B</text>
  <text x="650" y="642" fill="#e6edf3" font-size="13" text-anchor="middle">T</text>
  <!-- boxes -->
  <rect x="280" y="470" width="100" height="70" fill="none" stroke="#a78bfa"/><line x1="280" y1="505" x2="380" y2="505" stroke="#a78bfa" stroke-width="2"/>
  <rect x="600" y="360" width="100" height="80" fill="none" stroke="#a78bfa"/><line x1="600" y1="398" x2="700" y2="398" stroke="#a78bfa" stroke-width="2"/>
  <!-- dots per image -->
  <g fill="#e6edf3">
    <circle cx="300" cy="480" r="5"/><circle cx="318" cy="520" r="5"/><circle cx="336" cy="497" r="5"/><circle cx="350" cy="532" r="5"/><circle cx="364" cy="474" r="5"/><circle cx="324" cy="510" r="5"/>
    <circle cx="618" cy="372" r="5"/><circle cx="636" cy="430" r="5"/><circle cx="652" cy="392" r="5"/><circle cx="668" cy="410" r="5"/><circle cx="684" cy="366" r="5"/><circle cx="644" cy="402" r="5"/>
  </g>
  <!-- missing image highlighted on the plot -->
  <circle cx="420" cy="500" r="7" fill="none" stroke="#E69F00" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="740" cy="390" r="7" fill="none" stroke="#E69F00" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="740" y1="390" x2="790" y2="320" stroke="#E69F00"/>
  <line x1="420" y1="500" x2="790" y2="320" stroke="#E69F00" stroke-opacity="0.5"/>
  <rect x="680" y="290" width="200" height="40" rx="4" fill="#21262d" stroke="#E69F00"/>
  <text x="690" y="306" fill="#E69F00" font-size="11">fHqhyb · in set, not on the plot</text>
  <text x="690" y="322" fill="#7d8590" font-size="11">no tracks · no Mouse → open image</text>
  <text x="140" y="668" fill="#7d8590" font-size="11">Findings point at the data: the missing image is drawn as a ghost on the plot, not listed in a side chip strip.</text>

  <!-- Blackboard entry -->
  <rect x="956" y="88" width="452" height="610" rx="8" fill="#161b22" stroke="#21262d"/>
  <text x="976" y="116" fill="#7d8590" font-size="12">BLACKBOARD · claim entry · round 1 of 1</text>
  <text x="976" y="142" fill="#e6edf3" font-size="15" font-weight="600">T cells move faster than B cells</text>
  <text x="976" y="160" fill="#7d8590" font-size="11">stated by Dominik · 2026-11-05 · from board plot “Track speed”</text>

  <g font-size="12">
    <!-- finding 1 -->
    <rect x="976" y="176" width="412" height="104" rx="6" fill="#0f1117" stroke="#21262d"/>
    <circle cx="992" cy="194" r="5" fill="#E69F00"/><text x="1004" y="198" fill="#e6edf3" font-weight="600">Record · image in set has no tracks</text>
    <text x="992" y="218" fill="#7d8590">fHqhyb is in “B and T” but has no B/T tracks and</text>
    <text x="992" y="234" fill="#7d8590">no Mouse. The claim runs on 6 of 7 images.   inferred</text>
    <g transform="translate(992,248)"><rect width="56" height="22" rx="4" fill="#21262d"/><text x="28" y="15" fill="#e6edf3" text-anchor="middle">Fixed</text>
      <rect x="62" width="104" height="22" rx="4" fill="#3b2382" stroke="#7c3aed"/><text x="114" y="15" fill="#c4b5fd" text-anchor="middle">Acknowledged</text>
      <rect x="172" width="100" height="22" rx="4" fill="#21262d"/><text x="222" y="15" fill="#e6edf3" text-anchor="middle">False positive</text>
      <text x="282" y="15" fill="#7d8590">“dropped: no B/T”</text></g>

    <!-- finding 2 -->
    <rect x="976" y="290" width="412" height="96" rx="6" fill="#0f1117" stroke="#21262d"/>
    <circle cx="992" cy="308" r="5" fill="#E69F00"/><text x="1004" y="312" fill="#e6edf3" font-weight="600">Record · segmentation params not recorded</text>
    <text x="992" y="332" fill="#7d8590">7 of 7 images: neither in funParamsByName nor in</text>
    <text x="992" y="348" fill="#7d8590">the run log. Consistency can't be checked for them.</text>
    <g transform="translate(992,358)"><rect width="56" height="22" rx="4" fill="#21262d"/><text x="28" y="15" fill="#e6edf3" text-anchor="middle">Fixed</text>
      <rect x="62" width="104" height="22" rx="4" fill="#21262d"/><text x="114" y="15" fill="#e6edf3" text-anchor="middle">Acknowledged</text>
      <rect x="172" width="100" height="22" rx="4" fill="#21262d"/><text x="222" y="15" fill="#e6edf3" text-anchor="middle">False positive</text></g>

    <!-- consistency info -->
    <rect x="976" y="396" width="412" height="62" rx="6" fill="#0f1117" stroke="#21262d"/>
    <circle cx="992" cy="414" r="5" fill="#56B4E9"/><text x="1004" y="418" fill="#e6edf3" font-weight="600">Consistency · ✓ within tolerance</text>
    <text x="992" y="440" fill="#7d8590">Interval 30 s on all. Pixel size differs 0.07 % on 2 images.</text>

    <!-- review not run -->
    <rect x="976" y="468" width="412" height="120" rx="6" fill="#0f1117" stroke="#21262d" stroke-dasharray="4 3"/>
    <circle cx="992" cy="486" r="5" fill="#8C8C8C"/><text x="1004" y="490" fill="#e6edf3" font-weight="600">Claim review · not run</text>
    <text x="992" y="512" fill="#7d8590">Fixed set for “A &gt; B on a measure”:</text>
    <text x="992" y="530" fill="#7d8590">leave one image out · leave one mouse out ·</text>
    <text x="992" y="546" fill="#7d8590">per-mouse medians · mean instead of median</text>
    <text x="992" y="566" fill="#7d8590">Moves the claim if: direction flips, or the</text>
    <text x="992" y="582" fill="#7d8590">per-mouse test loses significance.</text>
  </g>
  <text x="976" y="618" fill="#7d8590" font-size="11">Each round stays on the entry. Passing on round 5</text>
  <text x="976" y="634" fill="#7d8590" font-size="11">shows rounds 1–4 and what changed between them.</text>

  <!-- export stamp -->
  <rect x="32" y="718" width="1376" height="110" rx="8" fill="#161b22" stroke="#21262d"/>
  <text x="52" y="746" fill="#7d8590" font-size="12">EXPORT · board dropdown (PDF / SVG / CSV) — not blocked; the figure carries the claim's state</text>
  <rect x="52" y="760" width="1336" height="50" rx="4" fill="#ffffff"/>
  <text x="68" y="782" fill="#333" font-size="12">Track speed (µm/min) by population · 4kS67f / B and T · exported 2026-11-05</text>
  <text x="68" y="800" fill="#555" font-size="11">Claim checked: record 1 acknowledged, 1 open · consistency ✓ · conventions ✓ · review not run · round 1 · blackboard entry ↗</text>
</svg>
