<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1130" viewBox="0 0 1440 1130" font-family="Inter, DejaVu Sans, sans-serif">
  <rect width="1440" height="1130" fill="#0f1117"/>
  <text x="32" y="40" fill="#e6edf3" font-size="20" font-weight="600">Claim recital in the GUI — v3, as built</text>
  <text x="32" y="64" fill="#7d8590" font-size="13">Real text from 4kS67f, set XcPcu8, 2026-11-08 (abridged). Dots are the real per-image medians. Checks run when the claim is stated and on every visit; the review runs on request.</text>

  <!-- ── Analysis board: the plot and its footer button ── -->
  <rect x="32" y="88" width="620" height="352" rx="8" fill="#161b22" stroke="#21262d"/>
  <text x="52" y="114" fill="#7d8590" font-size="12">ANALYSIS BOARD · 4kS67f · set XcPcu8</text>
  <text x="52" y="140" fill="#e6edf3" font-size="15" font-weight="600">Track speed (µm/min) · B/qc/_tracked vs T/qc/_tracked</text>
  <!-- axes: y(v) = 380 - 22 v -->
  <line x1="110" y1="160" x2="110" y2="380" stroke="#7d8590"/>
  <line x1="110" y1="380" x2="620" y2="380" stroke="#7d8590"/>
  <g fill="#7d8590" font-size="11" text-anchor="end"><text x="102" y="384">0</text><text x="102" y="296">4</text><text x="102" y="208">8</text></g>
  <text x="74" y="270" fill="#7d8590" font-size="11" transform="rotate(-90 74 270)" text-anchor="middle">median per image</text>
  <text x="250" y="398" fill="#e6edf3" font-size="13" text-anchor="middle">B</text>
  <text x="480" y="398" fill="#e6edf3" font-size="13" text-anchor="middle">T</text>
  <!-- B: 3.1 2.3 3.1 2.5 4.7 7.04 · T: 7.0 7.7 8.0 5.2 2.5 7.65 -->
  <rect x="215" y="277" width="70" height="40" fill="none" stroke="#8b7fd4"/><line x1="215" y1="312" x2="285" y2="312" stroke="#8b7fd4"/>
  <g fill="#e6edf3">
    <circle cx="232" cy="312" r="5"/><circle cx="250" cy="329" r="5"/><circle cx="268" cy="312" r="5"/><circle cx="242" cy="325" r="5"/><circle cx="262" cy="277" r="5"/><circle cx="250" cy="225" r="5"/>
  </g>
  <rect x="445" y="211" width="70" height="35" fill="none" stroke="#8b7fd4"/><line x1="445" y1="224" x2="515" y2="224" stroke="#8b7fd4"/>
  <g fill="#e6edf3">
    <circle cx="462" cy="226" r="5"/><circle cx="478" cy="211" r="5"/><circle cx="496" cy="204" r="5"/><circle cx="470" cy="266" r="5"/><circle cx="488" cy="325" r="5"/><circle cx="504" cy="212" r="5"/>
  </g>
  <!-- panel footer -->
  <line x1="32" y1="410" x2="652" y2="410" stroke="#21262d"/>
  <text x="52" y="431" fill="#7d8590" font-size="12">per image · Mann–Whitney · CSV · ⋯</text>
  <rect x="566" y="416" width="62" height="22" rx="4" fill="#21262d" stroke="#7c3aed"/>
  <text x="582" y="432" fill="#7d8590" font-size="13">✓</text><text x="602" y="432" fill="#E69F00" font-size="13" font-weight="600">7</text>
  <text x="556" y="431" fill="#c4b5fd" font-size="11" text-anchor="end">the claim button: open problems →</text>

  <!-- ── Popover from that button ── -->
  <path d="M597,440 L597,462" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="32" y="462" width="620" height="600" rx="8" fill="#1b1f27" stroke="#7c3aed"/>
  <text x="52" y="490" fill="#e6edf3" font-size="15" font-weight="600">T cells move faster than B cells</text>
  <text x="590" y="490" fill="#7d8590" font-size="14">✎</text><text x="614" y="490" fill="#7d8590" font-size="14">☰</text>
  <text x="632" y="508" fill="#7d8590" font-size="10" text-anchor="end">restate · open on the Blackboard</text>

  <text x="52" y="520" fill="#e6edf3" font-size="12" font-weight="600">Checks <tspan fill="#7d8590" font-weight="400">· no model</tspan></text>
  <g font-size="12">
    <text x="52" y="544" fill="#E69F00">⚠</text><text x="70" y="544" fill="#e6edf3" font-weight="600">Images</text>
    <text x="70" y="562" fill="#c9d1d9">Excluded from the set: fHqhyb</text>
    <text x="88" y="578" fill="#7d8590">→ Include it, or say in the claim why it is left out.</text>
    <text x="52" y="602" fill="#E69F00">⚠</text><text x="70" y="602" fill="#e6edf3" font-weight="600">Processing record</text>
    <text x="70" y="620" fill="#c9d1d9">Track dimensions (2D/3D) not on record for B and T on 6 images</text>
    <text x="88" y="636" fill="#7d8590">→ Re-run track measures with dims set.</text>
    <text x="52" y="660" fill="#E69F00">⚠</text><text x="70" y="660" fill="#e6edf3" font-weight="600">Same processing</text>
    <text x="70" y="678" fill="#c9d1d9">Gate shape differs across images for B and T</text>
    <text x="88" y="694" fill="#7d8590">→ Check they select the same cells on each, or apply one gate to all.</text>
    <text x="52" y="718" fill="#E69F00">⚠</text><text x="70" y="718" fill="#e6edf3" font-weight="600">Replicates</text>
    <text x="70" y="736" fill="#c9d1d9">Mouse: n = 4, a rank test can't go below p = 0.125</text>
    <text x="88" y="752" fill="#7d8590">→ Add replicates, or report the comparison as descriptive.</text>
    <text x="52" y="776" fill="#3fb950">✓</text><text x="70" y="776" fill="#e6edf3" font-weight="600">Units</text><text x="120" y="776" fill="#7d8590">  calibrated on every image</text>
  </g>

  <line x1="52" y1="792" x2="632" y2="792" stroke="#30363d"/>
  <text x="52" y="816" fill="#e6edf3" font-size="12" font-weight="600">Model review <tspan fill="#7d8590" font-weight="400">· opus, about a minute</tspan></text>
  <rect x="548" y="802" width="84" height="22" rx="4" fill="#21262d" stroke="#30363d"/><text x="590" y="817" fill="#e6edf3" font-size="11" text-anchor="middle">Run again</text>
  <g font-size="12">
    <text x="52" y="842" fill="#e6edf3" font-weight="600">The data</text>
    <text x="52" y="860" fill="#E69F00">⚠</text><text x="70" y="860" fill="#c9d1d9">In Mouse 2 (k3Tx90) T/qc is slower than B/qc (2.50 vs 4.70), the reverse</text>
    <text x="88" y="876" fill="#7d8590">→ Report the direction mouse by mouse.</text>
    <g font-size="10"><rect x="88" y="883" width="150" height="18" rx="3" fill="#21262d" stroke="#30363d"/><text x="96" y="896" fill="#c9d1d9">M2b · T · /qc/_tracked</text>
    <rect x="244" y="883" width="150" height="18" rx="3" fill="#21262d" stroke="#30363d"/><text x="252" y="896" fill="#c9d1d9">M2b · B · /qc/_tracked</text></g>
    <text x="52" y="924" fill="#e6edf3" font-weight="600">Same processing</text>
    <text x="52" y="942" fill="#E69F00">⚠</text><text x="70" y="942" fill="#c9d1d9">3w4IY5 is the only image with a crop step, run into its driftCorrected version</text>
    <text x="88" y="958" fill="#7d8590">→ Confirm its tracking is comparable with the other five images.</text>
    <g font-size="10"><rect x="88" y="965" width="176" height="18" rx="3" fill="#21262d" stroke="#30363d"/><text x="96" y="978" fill="#c9d1d9">Crop image · ran on M4d…_003</text></g>
    <text x="52" y="1006" fill="#e6edf3" font-weight="600">Replicates</text>
    <text x="52" y="1024" fill="#58a6ff">?</text><text x="70" y="1024" fill="#c9d1d9">EaMaVq and NSfanU carry Mouse = 4 but sit in set 'cropped' → in or out on purpose?</text>
    <text x="52" y="1048" fill="#c9d1d9" font-style="italic">Would support: per mouse — T higher in Mice 1 and 3, about the same in 4, lower in 2.</text>
  </g>

  <!-- ── Blackboard entry ── -->
  <rect x="680" y="88" width="728" height="852" rx="8" fill="#161b22" stroke="#21262d"/>
  <text x="700" y="114" fill="#7d8590" font-size="12">BLACKBOARD · claim entry · round 1</text>
  <text x="700" y="144" fill="#e6edf3" font-size="18" font-weight="600">T cells move faster than B cells</text>
  <text x="700" y="166" fill="#7d8590" font-size="12">B/qc/_tracked vs T/qc/_tracked · live.track.speed · per Mouse · set XcPcu8</text>
  <g font-size="12">
    <text x="700" y="198" fill="#e6edf3" font-weight="600">Images ⚠</text>
    <text x="712" y="216" fill="#c9d1d9">⚠ Excluded from the set: fHqhyb → Include it, or say why it is left out.</text>
    <text x="712" y="232" fill="#c9d1d9">⚠ No B and T data on fHqhyb · ⚠ Mouse blank on fHqhyb</text>
    <text x="700" y="258" fill="#e6edf3" font-weight="600">Processing record ⚠</text>
    <text x="712" y="276" fill="#c9d1d9">⚠ Processing params not on record: B tracking (5 images), T segment (6 images) …</text>
    <text x="712" y="292" fill="#c9d1d9">⚠ Track dimensions (2D/3D) not on record for B and T on 6 images → …</text>
    <text x="700" y="318" fill="#e6edf3" font-weight="600">Same processing ⚠</text>
    <text x="712" y="336" fill="#c9d1d9">⚠ Gate shape differs across images for B and T → …</text>
    <text x="712" y="352" fill="#7d8590">Pixel size (x) differs slightly across images · ✓ Same settings for the compared populations</text>
    <text x="700" y="378" fill="#e6edf3" font-weight="600">Replicates ⚠</text>
    <text x="712" y="396" fill="#c9d1d9">⚠ Mouse: n = 4 — a rank test can't go below p = 0.125 → …</text>
    <text x="712" y="412" fill="#7d8590">6 images from 4 replicates (Mouse)</text>
    <text x="700" y="438" fill="#e6edf3" font-weight="600">Units ✓</text>
    <text x="712" y="456" fill="#7d8590">✓ Calibrated in physical units on every image</text>
  </g>
  <line x1="700" y1="474" x2="1388" y2="474" stroke="#30363d"/>
  <text x="700" y="500" fill="#e6edf3" font-size="14" font-weight="600">Model review</text>
  <text x="700" y="520" fill="#7d8590" font-size="12">One opus turn that read the claim and the record but not your notes. Mark each point Good, Bad or Unsure.</text>
  <text x="700" y="548" fill="#e6edf3" font-size="12" font-weight="600">The data</text>
  <rect x="700" y="558" width="688" height="80" rx="6" fill="#0f1117" stroke="#30363d"/>
  <text x="714" y="580" fill="#c9d1d9" font-size="12"><tspan fill="#7d8590">s27 ·</tspan> In Mouse 2 (k3Tx90, its only image) the median track speed of T/qc is lower</text>
  <text x="714" y="596" fill="#c9d1d9" font-size="12">than B/qc (2.50 vs 4.70) → Report the direction mouse by mouse.</text>
  <text x="714" y="624" fill="#7d8590" font-size="11" font-style="italic">refs: M2b-CD8-GFP-CD20-Tom · T · /qc/_tracked, … · B · /qc/_tracked</text>
  <g font-size="11">
    <rect x="1220" y="610" width="48" height="20" rx="4" fill="#21262d" stroke="#e6a817"/><text x="1244" y="624" fill="#e6edf3" text-anchor="middle">Good</text>
    <rect x="1272" y="610" width="44" height="20" rx="4" fill="#21262d" stroke="#30363d"/><text x="1294" y="624" fill="#e6edf3" text-anchor="middle">Bad</text>
    <rect x="1320" y="610" width="58" height="20" rx="4" fill="#21262d" stroke="#30363d"/><text x="1349" y="624" fill="#e6edf3" text-anchor="middle">Unsure</text>
  </g>
  <rect x="700" y="646" width="688" height="56" rx="6" fill="#0f1117" stroke="#30363d"/>
  <text x="714" y="668" fill="#c9d1d9" font-size="12"><tspan fill="#7d8590">s28 ·</tspan> In Mouse 4 (3w4IY5) B/qc 7.04 is close to T/qc 7.65, while B elsewhere is 2.3–4.7</text>
  <text x="714" y="688" fill="#c9d1d9" font-size="12">→ Look at the B tracks on 3w4IY5 before counting Mouse 4 as support.</text>
  <text x="700" y="724" fill="#7d8590" font-size="12">… s29 B tracks on 3w4IY5 several times longer · s32 few tracks per image · s33 no minimum track length on record</text>
  <text x="700" y="752" fill="#e6edf3" font-size="12" font-weight="600">Same processing · Replicates</text>
  <text x="700" y="772" fill="#7d8590" font-size="12">s30 crop step only on 3w4IY5 · s31 Mouse 4 images in another set</text>
  <text x="700" y="802" fill="#e6edf3" font-size="14" font-weight="600">What the record would support</text>
  <text x="700" y="822" fill="#c9d1d9" font-size="12" font-style="italic">Per mouse only: median T speed higher than B in Mouse 1 and all three Mouse 3 images,</text>
  <text x="700" y="838" fill="#c9d1d9" font-size="12" font-style="italic">about the same in Mouse 4 and lower in Mouse 2.</text>
  <text x="700" y="872" fill="#7d8590" font-size="11">Kiwi refs</text>
  <g font-size="10">
    <rect x="700" y="880" width="168" height="20" rx="3" fill="#21262d" stroke="#30363d"/><text x="708" y="894" fill="#c9d1d9">M2b-CD8-GFP-CD20-Tom · T · qc</text>
    <rect x="874" y="880" width="168" height="20" rx="3" fill="#21262d" stroke="#30363d"/><text x="882" y="894" fill="#c9d1d9">M4d-…_003 · B · /qc/_tracked</text>
    <rect x="1048" y="880" width="176" height="20" rx="3" fill="#21262d" stroke="#30363d"/><text x="1056" y="894" fill="#c9d1d9">Crop image · ran on M4d…_003</text>
    <rect x="1230" y="880" width="120" height="20" rx="3" fill="#21262d" stroke="#30363d"/><text x="1238" y="894" fill="#c9d1d9">M4c-…_002 · +7</text>
  </g>
  <text x="700" y="924" fill="#7d8590" font-size="11">Restating starts round 2: the review is cleared, earlier rounds are listed at the end.</text>

  <!-- ── not built ── -->
  <rect x="680" y="956" width="728" height="106" rx="8" fill="none" stroke="#484f58" stroke-dasharray="6 5"/>
  <text x="700" y="982" fill="#7d8590" font-size="13" font-weight="600">Not built yet</text>
  <text x="700" y="1004" fill="#7d8590" font-size="12">Findings drawn on the dots they concern (k3Tx90 reverses, 3w4IY5's B outlier) and the claim on the plot.</text>
  <text x="700" y="1022" fill="#7d8590" font-size="12">Export stamp: what ran and what is open, in the exported figure. Never blocks.</text>
  <text x="700" y="1040" fill="#7d8590" font-size="12">Review points in the briefing's openClaims · claims between treatment arms.</text>

  <!-- ── changes ── -->
  <text x="32" y="1088" fill="#3fb950" font-size="13" font-weight="600">Changed from v2 (2026-11-06), after using it on 4kS67f</text>
  <text x="32" y="1108" fill="#7d8590" font-size="12">One footer button + popover, not a row of chips · checks are facts by category, each problem with what to do · Good / Bad / Unsure only on the model's points ·</text>
  <text x="32" y="1124" fill="#7d8590" font-size="12">Unit → Replicate (can combine attributes) · the review names its model, not a $ cost, has clickable refs, and says why when a run fails.</text>
</svg>
