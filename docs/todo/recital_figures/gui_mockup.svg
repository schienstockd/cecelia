<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" font-family="Inter, DejaVu Sans, sans-serif">
  <rect width="1440" height="960" fill="#0f1117"/>
  <text x="32" y="40" fill="#e6edf3" font-size="20" font-weight="600">Claim recital in the GUI — mockup v2</text>
  <text x="32" y="64" fill="#7d8590" font-size="13">Findings are the real P0 / P2 ones on 4kS67f; dot positions illustrative · checks run when the claim is stated · one review on request · export carries a stamp, never blocks</text>

  <!-- Analysis board -->
  <rect x="32" y="88" width="900" height="610" rx="8" fill="#161b22" stroke="#21262d"/>
  <text x="52" y="116" fill="#7d8590" font-size="12">ANALYSIS BOARD · 4kS67f · set "B and T"</text>
  <rect x="52" y="130" width="860" height="550" rx="6" fill="#0f1117" stroke="#21262d"/>
  <text x="72" y="158" fill="#e6edf3" font-size="15" font-weight="600">Track speed (µm/min) by population</text>
  <text x="880" y="158" fill="#7d8590" font-size="16" text-anchor="end">⋯</text>

  <!-- claim strip -->
  <rect x="72" y="172" width="820" height="96" rx="6" fill="#2d1b69" stroke="#7c3aed"/>
  <text x="88" y="194" fill="#c4b5fd" font-size="12">CLAIM · scope from this plot: 6 of 7 images · B/qc vs T/qc · live.track.speed · <tspan fill="#e6edf3" font-weight="600">unit: Mouse (n = 4)</tspan></text>
  <text x="88" y="220" fill="#e6edf3" font-size="16" font-weight="600">“T cells move faster than B cells”</text>
  <g transform="translate(88,232)" font-size="12">
    <rect x="0" y="0" width="92" height="26" rx="13" fill="#21262d"/><circle cx="14" cy="13" r="5" fill="#E69F00"/><text x="26" y="17" fill="#e6edf3">Record 3</text>
    <rect x="100" y="0" width="118" height="26" rx="13" fill="#21262d"/><circle cx="114" cy="13" r="5" fill="#E69F00"/><text x="126" y="17" fill="#e6edf3">Consistency 1</text>
    <rect x="226" y="0" width="118" height="26" rx="13" fill="#21262d"/><circle cx="240" cy="13" r="5" fill="#E69F00"/><text x="252" y="17" fill="#e6edf3">Conventions 1</text>
    <rect x="352" y="0" width="104" height="26" rx="13" fill="#21262d"/><circle cx="366" cy="13" r="5" fill="#CC79A7"/><text x="378" y="17" fill="#e6edf3">Review 2</text>
  </g>
  <rect x="740" y="232" width="140" height="26" rx="5" fill="#7659cf"/><text x="810" y="249" fill="#ffffff" font-size="12" text-anchor="middle">Review again · ~$1</text>

  <!-- plot axes: y(v) = 620 - 27.5 v -->
  <line x1="140" y1="290" x2="140" y2="620" stroke="#7d8590"/>
  <line x1="140" y1="620" x2="860" y2="620" stroke="#7d8590"/>
  <g fill="#7d8590" font-size="11" text-anchor="end">
    <text x="132" y="624">0</text><text x="132" y="514">4</text><text x="132" y="404">8</text><text x="132" y="294">12</text>
  </g>
  <text x="96" y="460" fill="#7d8590" font-size="11" transform="rotate(-90 96 460)" text-anchor="middle">median track speed per image</text>
  <text x="330" y="642" fill="#e6edf3" font-size="13" text-anchor="middle">B</text>
  <text x="650" y="642" fill="#e6edf3" font-size="13" text-anchor="middle">T</text>
  <rect x="280" y="482" width="100" height="60" fill="none" stroke="#a78bfa"/><line x1="280" y1="515" x2="380" y2="515" stroke="#a78bfa" stroke-width="2"/>
  <rect x="600" y="410" width="100" height="56" fill="none" stroke="#a78bfa"/><line x1="600" y1="441" x2="700" y2="441" stroke="#a78bfa" stroke-width="2"/>
  <g fill="#e6edf3">
    <circle cx="300" cy="557" r="5"/><circle cx="318" cy="535" r="5"/><circle cx="342" cy="521" r="5"/><circle cx="360" cy="510" r="5"/>
    <circle cx="636" cy="469" r="5"/><circle cx="652" cy="450" r="5"/><circle cx="668" cy="433" r="5"/><circle cx="684" cy="417" r="5"/><circle cx="620" cy="397" r="5"/>
  </g>
  <!-- 3w4IY5 B: consistency finding on the dot -->
  <circle cx="330" cy="428" r="5" fill="#e6edf3"/><circle cx="330" cy="428" r="10" fill="none" stroke="#E69F00" stroke-width="2"/>
  <line x1="340" y1="424" x2="400" y2="380" stroke="#E69F00"/>
  <rect x="400" y="362" width="168" height="36" rx="4" fill="#21262d" stroke="#E69F00"/>
  <text x="408" y="377" fill="#E69F00" font-size="11">3w4IY5 · B re-tracked</text>
  <text x="408" y="391" fill="#7d8590" font-size="11">other params → open log</text>
  <!-- k3Tx90 pair: review finding on the dots -->
  <circle cx="372" cy="491" r="5" fill="#e6edf3"/><circle cx="372" cy="491" r="10" fill="none" stroke="#CC79A7" stroke-width="2"/>
  <circle cx="610" cy="551" r="5" fill="#e6edf3"/><circle cx="610" cy="551" r="10" fill="none" stroke="#CC79A7" stroke-width="2"/>
  <line x1="382" y1="493" x2="600" y2="549" stroke="#CC79A7" stroke-dasharray="5 4"/>
  <rect x="706" y="528" width="180" height="50" rx="4" fill="#21262d" stroke="#CC79A7"/>
  <text x="714" y="544" fill="#CC79A7" font-size="11">k3Tx90 · reverses it</text>
  <text x="714" y="558" fill="#7d8590" font-size="11">B 3D, T 2D here, the</text>
  <text x="714" y="572" fill="#7d8590" font-size="11">other way round elsewhere</text>
  <line x1="620" y1="551" x2="706" y2="551" stroke="#CC79A7"/>
  <!-- fHqhyb ghosts on the baseline -->
  <circle cx="394" cy="608" r="7" fill="none" stroke="#E69F00" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="714" cy="608" r="7" fill="none" stroke="#E69F00" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="404" y="612" fill="#E69F00" font-size="11">fHqhyb · in set, no tracks, no Mouse → open image</text>
  <text x="140" y="668" fill="#7d8590" font-size="11">Findings sit on the dots they're about: orange = a check, pink = the review. The image with no data is a ghost on the axis.</text>

  <!-- Blackboard entry -->
  <rect x="956" y="88" width="452" height="610" rx="8" fill="#161b22" stroke="#21262d"/>
  <text x="976" y="116" fill="#7d8590" font-size="12">BLACKBOARD · claim entry · round 1</text>
  <text x="976" y="142" fill="#e6edf3" font-size="15" font-weight="600">T cells move faster than B cells</text>
  <text x="976" y="160" fill="#7d8590" font-size="11">stated by Dominik · from board plot “Track speed” · ran: S0 S1 S2 · review</text>

  <g font-size="12">
    <!-- check findings: one row each; status is computed, verdict is the blackboard's own -->
    <rect x="976" y="172" width="412" height="270" rx="6" fill="#0f1117" stroke="#21262d"/>
    <text x="992" y="192" fill="#7d8590" font-size="11">CHECKS · re-run on every visit; a finding closes when it's gone</text>

    <circle cx="992" cy="214" r="5" fill="#E69F00"/><text x="1004" y="218" fill="#e6edf3" font-weight="600">Record · fHqhyb in set, no tracks</text>
    <text x="1004" y="234" fill="#7d8590" font-size="11">Claim runs on 6 of 7 images. Mouse blank.</text>
    <circle cx="992" cy="260" r="5" fill="#E69F00"/><text x="1004" y="264" fill="#e6edf3" font-weight="600">Record · T segmentation params not recorded</text>
    <text x="1004" y="280" fill="#7d8590" font-size="11">B's are. Whether B and T match can't be checked.</text>
    <circle cx="992" cy="306" r="5" fill="#E69F00"/><text x="1004" y="310" fill="#e6edf3" font-weight="600">Record · track dims not recorded, 6 images</text>
    <text x="1004" y="326" fill="#7d8590" font-size="11">2D and 3D speeds can't be told apart from the record.</text>
    <circle cx="992" cy="352" r="5" fill="#E69F00"/><text x="1004" y="356" fill="#e6edf3" font-weight="600">Consistency · 3w4IY5 B tracked with other params</text>
    <text x="1004" y="372" fill="#7d8590" font-size="11">Re-tracked later; it is the B outlier (7.0 vs 2.3–4.7).</text>
    <circle cx="992" cy="398" r="5" fill="#E69F00"/><text x="1004" y="402" fill="#e6edf3" font-weight="600">Conventions · tested per track, unit is Mouse</text>
    <text x="1004" y="418" fill="#7d8590" font-size="11">p = 2e-10 over 330 tracks; per mouse p = 0.18, n = 4.</text>
    <text x="1004" y="434" fill="#56d364" font-size="10">S2 rule — not built yet</text>
    <!-- verdict pills (existing Good / Bad / Unsure), one per finding; shown on row 1 -->
    <g transform="translate(1250,206)" font-size="10"><rect width="38" height="16" rx="3" fill="#3b2382" stroke="#7c3aed"/><text x="19" y="12" fill="#c4b5fd" text-anchor="middle">Good</text>
      <rect x="42" width="32" height="16" rx="3" fill="#21262d"/><text x="58" y="12" fill="#e6edf3" text-anchor="middle">Bad</text>
      <rect x="78" width="50" height="16" rx="3" fill="#21262d"/><text x="103" y="12" fill="#e6edf3" text-anchor="middle">Unsure</text></g>

    <!-- review -->
    <rect x="976" y="452" width="412" height="180" rx="6" fill="#0f1117" stroke="#CC79A7" stroke-dasharray="4 3"/>
    <text x="992" y="472" fill="#7d8590" font-size="11">REVIEW · advisory · claim + record only, not the chat · $1.07, 2 min</text>
    <circle cx="992" cy="494" r="5" fill="#CC79A7"/><text x="1004" y="498" fill="#e6edf3" font-weight="600">Speeds mix 2D and 3D</text><text x="1384" y="498" fill="#7d8590" font-size="10" text-anchor="end">recomputed</text>
    <text x="1004" y="514" fill="#7d8590" font-size="11">T 3D, B 2D in 4 images, swapped in k3Tx90. Matched,</text>
    <text x="1004" y="528" fill="#7d8590" font-size="11">the gap is ≈ 1.2 µm/min, not 2.5.</text>
    <circle cx="992" cy="552" r="5" fill="#CC79A7"/><text x="1004" y="556" fill="#e6edf3" font-weight="600">Same test run 7 times on 07-27</text><text x="1384" y="556" fill="#7d8590" font-size="10" text-anchor="end">inferred</text>
    <text x="1004" y="572" fill="#7d8590" font-size="11">1 Mann–Whitney, 6 Welch; reported once as ****.</text>
    <text x="992" y="598" fill="#c4b5fd" font-size="11">What the record would support:</text>
    <text x="992" y="614" fill="#e6edf3" font-size="11">“T faster than B per image, with matched dims” (illustrative)</text>

    <text x="976" y="654" fill="#7d8590" font-size="11">Within tolerance (display only): listed here, one line, no action.</text>
    <text x="976" y="676" fill="#7d8590" font-size="11">Rewording the claim starts round 2; both rounds stay on the entry.</text>
  </g>

  <!-- export stamp -->
  <rect x="32" y="718" width="1376" height="104" rx="8" fill="#161b22" stroke="#21262d"/>
  <text x="52" y="744" fill="#7d8590" font-size="12">EXPORT · board dropdown (PDF / SVG / PNG / CSV): never blocked; the figure carries what ran and what's open</text>
  <rect x="52" y="756" width="1336" height="50" rx="4" fill="#ffffff"/>
  <text x="68" y="777" fill="#333" font-size="12">Track speed (µm/min) by population · 4kS67f / B and T · exported 2026-11-06</text>
  <text x="68" y="795" fill="#555" font-size="11">Claim checked, round 1: record 3 open · consistency 1 open · conventions 1 open · review run (2, advisory) · not checked: perturbations · blackboard entry ↗</text>

  <!-- what changed -->
  <text x="32" y="852" fill="#56d364" font-size="12" font-weight="600">Changed from v1 (2026-11-05)</text>
  <g fill="#7d8590" font-size="12">
    <text x="32" y="874">· Real findings. v1 showed Consistency ✓ and Conventions ✓; on this claim neither holds. The statistical unit (Mouse, n) is part of the scope, from the plot's group-by.</text>
    <text x="32" y="894">· "Check claim" (fixed perturbation set) → one plain Review, as in P2. Its findings are pink and say how they know: recomputed or inferred.</text>
    <text x="32" y="914">· No Fixed / Acknowledged / False positive tags. Status comes from re-running the checks; the analyst's verdict reuses the blackboard's Good / Bad / Unsure.</text>
    <text x="32" y="934">· Findings point at dots, not only at a missing image. The stamp lists what didn't run.</text>
  </g>
</svg>
