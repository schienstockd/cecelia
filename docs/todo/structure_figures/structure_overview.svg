<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="930" viewBox="0 0 1800 930" font-family="Helvetica, Arial, DejaVu Sans, sans-serif">
<defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b6964"/></marker></defs>
<rect width="1800" height="930" fill="#f9f8f4"/>
<text x="32" y="58" font-size="32" fill="#222"><tspan font-weight="700">Cecelia structure</tspan><tspan fill="#666"> · what makes an analysis checkable</tspan></text>
<text x="32" y="96" font-size="20" fill="#666" text-anchor="start" xml:space="preserve"><tspan>Every step leaves a record, checks read it, chains replay it. AI is optional and reads the same record</tspan></text>
<line x1="32" y1="118" x2="760" y2="118" stroke="#6b6964" stroke-width="2"/>
<rect x="1180" y="36" width="22" height="16" rx="3" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="1212" y="50" font-size="15" fill="#555" text-anchor="start" xml:space="preserve"><tspan>exists</tspan></text>
<rect x="1180" y="62" width="22" height="16" rx="3" fill="#fff" stroke="#D55E00" stroke-width="2" stroke-dasharray="4 3"/>
<text x="1212" y="76" font-size="15" fill="#D55E00" text-anchor="start" xml:space="preserve"><tspan>gap</tspan></text>
<rect x="1330" y="36" width="22" height="16" rx="3" fill="#f2e1ea" stroke="#222" stroke-width="2"/>
<text x="1362" y="50" font-size="15" fill="#555" text-anchor="start" xml:space="preserve"><tspan>model involved, optional</tspan></text>
<text x="1341" y="77" font-size="16" fill="#0b7a3e" text-anchor="middle" xml:space="preserve"><tspan>■</tspan></text>
<text x="1362" y="76" font-size="15" fill="#0b7a3e" text-anchor="start" xml:space="preserve"><tspan>added 2026-11-07</tspan></text>
<text x="32" y="177" font-size="24" fill="#222" text-anchor="start" xml:space="preserve" font-weight="700"><tspan>AI</tspan></text>
<text x="32" y="201" font-size="16" fill="#666" text-anchor="start" xml:space="preserve"><tspan>optional</tspan></text>
<rect x="250" y="140" width="1510" height="78" rx="12" fill="#f2e1ea" stroke="#222" stroke-width="3" stroke-dasharray="8 6"/>
<text x="1005" y="173" font-size="19" fill="#222" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">Kiwi</tspan><tspan> and </tspan><tspan font-weight="700">Claude Code</tspan><tspan> read the record, QC and checks through the same readers as the app</tspan></text>
<text x="1005" y="200" font-size="16" fill="#666" text-anchor="middle" xml:space="preserve"><tspan>anything they write is stamped (who, model, session) · they design work, you run it · everything below works with AI off</tspan></text>
<text x="32" y="291" font-size="24" fill="#222" text-anchor="start" xml:space="preserve" font-weight="700"><tspan>Pipeline</tspan></text>
<text x="32" y="315" font-size="16" fill="#666" text-anchor="start" xml:space="preserve"><tspan>what you do</tspan></text>
<rect x="250" y="250" width="237" height="86" rx="12" fill="#fff" stroke="#222" stroke-width="5"/>
<text x="368" y="288" font-size="24" fill="#222" text-anchor="middle" xml:space="preserve" font-weight="700"><tspan>Acquire</tspan></text>
<text x="368" y="316" font-size="16" fill="#666" text-anchor="middle" xml:space="preserve"><tspan>microscope settings</tspan></text>
<line x1="489" y1="293" x2="503" y2="293" stroke="#6b6964" stroke-width="3" marker-end="url(#g)"/>
<rect x="505" y="250" width="237" height="86" rx="12" fill="#fff" stroke="#222" stroke-width="5"/>
<text x="623" y="288" font-size="24" fill="#222" text-anchor="middle" xml:space="preserve" font-weight="700"><tspan>Import</tspan></text>
<text x="623" y="316" font-size="16" fill="#666" text-anchor="middle" xml:space="preserve"><tspan>calibration, units</tspan></text>
<line x1="743" y1="293" x2="757" y2="293" stroke="#6b6964" stroke-width="3" marker-end="url(#g)"/>
<rect x="759" y="250" width="237" height="86" rx="12" fill="#fff" stroke="#222" stroke-width="5"/>
<text x="878" y="288" font-size="24" fill="#222" text-anchor="middle" xml:space="preserve" font-weight="700"><tspan>Process</tspan></text>
<text x="878" y="316" font-size="16" fill="#666" text-anchor="middle" xml:space="preserve"><tspan>segment · track · correct</tspan></text>
<line x1="998" y1="293" x2="1012" y2="293" stroke="#6b6964" stroke-width="3" marker-end="url(#g)"/>
<rect x="1014" y="250" width="237" height="86" rx="12" fill="#fff" stroke="#222" stroke-width="5"/>
<text x="1132" y="288" font-size="24" fill="#222" text-anchor="middle" xml:space="preserve" font-weight="700"><tspan>Populations</tspan></text>
<text x="1132" y="316" font-size="16" fill="#666" text-anchor="middle" xml:space="preserve"><tspan>gating, clusters</tspan></text>
<line x1="1253" y1="293" x2="1267" y2="293" stroke="#6b6964" stroke-width="3" marker-end="url(#g)"/>
<rect x="1269" y="250" width="237" height="86" rx="12" fill="#fff" stroke="#222" stroke-width="5"/>
<text x="1387" y="288" font-size="24" fill="#222" text-anchor="middle" xml:space="preserve" font-weight="700"><tspan>Analyse</tspan></text>
<text x="1387" y="316" font-size="16" fill="#666" text-anchor="middle" xml:space="preserve"><tspan>measures, plots, statistics</tspan></text>
<line x1="1507" y1="293" x2="1521" y2="293" stroke="#6b6964" stroke-width="3" marker-end="url(#g)"/>
<rect x="1523" y="250" width="237" height="86" rx="12" fill="#fff" stroke="#222" stroke-width="5"/>
<text x="1642" y="288" font-size="24" fill="#222" text-anchor="middle" xml:space="preserve" font-weight="700"><tspan>Export</tspan></text>
<text x="1642" y="316" font-size="16" fill="#666" text-anchor="middle" xml:space="preserve"><tspan>figures, tables</tspan></text>
<rect x="505" y="352" width="1255" height="46" rx="10" fill="#dde9f2" stroke="#222" stroke-width="3"/>
<text x="1132" y="382" font-size="18" fill="#222" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">One scheduler runs every task</tspan><tspan> — checks the params, logs the run (custom modules too)</tspan></text>
<text x="32" y="474" font-size="24" fill="#222" text-anchor="start" xml:space="preserve" font-weight="700"><tspan>Record</tspan></text>
<text x="32" y="498" font-size="16" fill="#666" text-anchor="start" xml:space="preserve"><tspan>what was done</tspan></text>
<rect x="240" y="418" width="1520" height="116" rx="14" fill="none" stroke="#bbb" stroke-width="1.5"/>
<rect x="250" y="430" width="237" height="92" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="368" y="482" font-size="16" fill="#222" text-anchor="middle" xml:space="preserve"><tspan>settings from the file</tspan></text>
<rect x="505" y="430" width="237" height="92" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="623" y="460" font-size="16" fill="#222" text-anchor="middle" xml:space="preserve"><tspan>calibration + units</tspan></text>
<text x="623" y="482" font-size="16" fill="#D55E00" text-anchor="middle" xml:space="preserve"><tspan>source: path only,</tspan></text>
<text x="623" y="504" font-size="16" fill="#D55E00" text-anchor="middle" xml:space="preserve"><tspan>no checksum</tspan></text>
<rect x="759" y="430" width="237" height="92" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="878" y="460" font-size="16" fill="#222" text-anchor="middle" xml:space="preserve"><tspan>run log: params, status</tspan></text>
<text x="878" y="482" font-size="16" fill="#0b7a3e" text-anchor="middle" xml:space="preserve"><tspan>version · device · who</tspan></text>
<text x="878" y="504" font-size="16" fill="#0b7a3e" text-anchor="middle" xml:space="preserve"><tspan>skipped images + why</tspan></text>
<rect x="1014" y="430" width="237" height="92" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="1132" y="460" font-size="16" fill="#222" text-anchor="middle" xml:space="preserve"><tspan>gate tree, who drew it</tspan></text>
<text x="1132" y="482" font-size="16" fill="#D55E00" text-anchor="middle" xml:space="preserve"><tspan>no gate history</tspan></text>
<text x="1132" y="504" font-size="16" fill="#D55E00" text-anchor="middle" xml:space="preserve"><tspan>GUI edits not logged</tspan></text>
<rect x="1269" y="430" width="237" height="92" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="1387" y="460" font-size="16" fill="#222" text-anchor="middle" xml:space="preserve"><tspan>analysis tasks logged</tspan></text>
<text x="1387" y="482" font-size="16" fill="#D55E00" text-anchor="middle" xml:space="preserve"><tspan>plots + statistics:</tspan></text>
<text x="1387" y="504" font-size="16" fill="#D55E00" text-anchor="middle" xml:space="preserve"><tspan>no record</tspan></text>
<rect x="1523" y="430" width="237" height="92" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="1642" y="460" font-size="16" fill="#222" text-anchor="middle" xml:space="preserve"><tspan>CSV rows trace back</tspan></text>
<text x="1642" y="482" font-size="16" fill="#D55E00" text-anchor="middle" xml:space="preserve"><tspan>PDF / SVG carry</tspan></text>
<text x="1642" y="504" font-size="16" fill="#D55E00" text-anchor="middle" xml:space="preserve"><tspan>no record</tspan></text>
<text x="32" y="648" font-size="24" fill="#222" text-anchor="start" xml:space="preserve" font-weight="700"><tspan>Checks</tspan></text>
<text x="32" y="672" font-size="16" fill="#666" text-anchor="start" xml:space="preserve"><tspan>can it be trusted</tspan></text>
<rect x="240" y="552" width="1520" height="196" rx="14" fill="none" stroke="#bbb" stroke-width="1.5"/>
<rect x="250" y="564" width="237" height="90" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="368" y="604" font-size="16" fill="#222" text-anchor="middle" xml:space="preserve"><tspan>saturation, photon</tspan></text>
<text x="368" y="626" font-size="16" fill="#222" text-anchor="middle" xml:space="preserve"><tspan>limit, depth profile</tspan></text>
<rect x="505" y="564" width="237" height="90" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="623" y="604" font-size="16" fill="#222" text-anchor="middle" xml:space="preserve"><tspan>calibration, partial</tspan></text>
<text x="623" y="626" font-size="16" fill="#222" text-anchor="middle" xml:space="preserve"><tspan>timepoints, pyramid</tspan></text>
<rect x="759" y="564" width="237" height="90" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="878" y="593" font-size="16" fill="#222" text-anchor="middle" xml:space="preserve"><tspan>QC on every run</tspan></text>
<text x="878" y="615" font-size="16" fill="#222" text-anchor="middle" xml:space="preserve"><tspan>cohort QC per set</tspan></text>
<text x="878" y="637" font-size="16" fill="#D55E00" text-anchor="middle" xml:space="preserve"><tspan>(button only)</tspan></text>
<rect x="1014" y="564" width="237" height="90" rx="10" fill="#fff" stroke="#D55E00" stroke-width="2" stroke-dasharray="6 4"/>
<text x="1132" y="615" font-size="16" fill="#D55E00" text-anchor="middle" xml:space="preserve"><tspan>no QC on gating</tspan></text>
<rect x="1269" y="564" width="237" height="90" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="1387" y="604" font-size="16" fill="#222" text-anchor="middle" xml:space="preserve"><tspan>spatial QC</tspan></text>
<text x="1387" y="626" font-size="16" fill="#D55E00" text-anchor="middle" xml:space="preserve"><tspan>no QC on statistics</tspan></text>
<rect x="1523" y="564" width="237" height="90" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="1642" y="615" font-size="16" fill="#222" text-anchor="middle" xml:space="preserve"><tspan>export QC</tspan></text>
<text x="254" y="676" font-size="15" fill="#666" text-anchor="start" xml:space="preserve"><tspan>quality checks at each step · warn, never block</tspan></text>
<rect x="505" y="688" width="1255" height="48" rx="10" fill="#dde9f2" stroke="#222" stroke-width="3"/>
<text x="1132" y="719" font-size="17" fill="#222" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">Claim checks</tspan><tspan> (rules, no model): record complete? · images treated the same? · right statistical unit?</tspan></text>
<text x="32" y="799" font-size="24" fill="#222" text-anchor="start" xml:space="preserve" font-weight="700"><tspan>Replay</tspan></text>
<text x="32" y="823" font-size="16" fill="#666" text-anchor="start" xml:space="preserve"><tspan>run it again</tspan></text>
<rect x="505" y="774" width="746" height="54" rx="10" fill="#dde9f2" stroke="#222" stroke-width="3"/>
<text x="878" y="808" font-size="17" fill="#222" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">Chains</tspan><tspan>: save the steps once, re-run on new images, skip what has not changed</tspan></text>
<rect x="1269" y="774" width="491" height="54" rx="10" fill="#fff" stroke="#D55E00" stroke-width="2" stroke-dasharray="6 4"/>
<text x="1514" y="808" font-size="17" fill="#D55E00" text-anchor="middle" xml:space="preserve"><tspan>re-run from an old run's frozen template</tspan></text>
<text x="32" y="880" font-size="16" fill="#555" text-anchor="start" xml:space="preserve"><tspan>Gaps cluster under Populations and Analyse: a plotted number traces back to its population, but not to the gate as it was when plotted.</tspan></text>
<text x="32" y="906" font-size="14" fill="#999" text-anchor="start" xml:space="preserve"><tspan>v1 2026-11-07, from docs/todo/CECELIA_STRUCTURE_AUDIT.md (code refs per cell). Maturity tiers not shown: no feature is Tested yet.</tspan></text>
</svg>