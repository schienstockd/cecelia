# What each committed fixture can prove.
#
# A test whose assertions depend on a property of the data asks for it by name:
#     fixture_for(:cells, :calibrated; need = "<id>")     (Julia, app/test/fixture_registry.jl)
#     fixture_for("cells", "calibrated", need="<id>")     (Python, cecelia.tests.fixture_registry)
# It gets a fixture that has every property, or nothing — never a stand-in. With nothing, the test
# skips and names its request in NEEDS.toml. Data-agnostic plumbing can keep `fixture_path(...)`.
#
# `properties` are facts read off the data, not wishes: the `fixture registry` testsets re-derive every
# property marked `checked` in [vocabulary] from the files, and fail on a claim the data doesn't back
# or on a checked property the data has but the entry leaves out.
# Background: docs/DEV.md → *Test data fixtures* → *Ask for properties, not a path*.

[vocabulary]
# property = [checked?, what it means]
cells          = [true,  "a labelProps cell table (labelProps/<value_name>.h5ad) with at least one cell"]
movie          = [true,  "more than one timepoint in the cell table (centroid_t)"]
still          = [true,  "one timepoint or no time axis"]
3d             = [true,  "measured in 3D: centroid_z in the cell table, or a z axis longer than 1 in the image store"]
2d             = [true,  "measured in 2D: no centroid_z, or a single z plane"]
tracked        = [true,  "track_id in the cell table"]
track-table    = [true,  "a companion per-track table (<value_name>__tracks.h5ad)"]
calibrated     = [true,  "PhysicalSizeX and PhysicalSizeY stored and neither is 1.0, so a missing µm conversion shows"]
marker-names   = [true,  "channel names are markers, not placeholders like ch0"]
multiplex      = [true,  "10 or more channels, the app's multiplex panel (setRecipe.ts MULTIPLEX_MIN): PhenoCycler, IBEX, CyCIF"]
image-store    = [true,  "an OME-ZARR image store on disk"]
label-store    = [true,  "a label zarr on disk"]
regions        = [true,  "a regions.* column in the cell table"]
multi-image    = [true,  "the project holds more than one image with a cell table"]
multi-segmentation = [true, "more than one cell table (value name) on one image"]
structure      = [false, "a population that marks a tissue structure (follicle, GC, vessel, aggregate)"]
real           = [false, "measured from a real acquisition, not synthesised"]

# One table per fixture. `dir` is relative to test-data/projects and is where ccid.json lives;
# `image_dir` (optional) is where the image store lives when it is a different set dir.
# `technology` is the acquisition technology as the readers report it (`meta.acquisition.technology`:
# "two-photon", "confocal", "widefield", "airyscan", "brightfield"), or "synthetic".

[fixtures.KDIeEm]
dir = "testpr/1/KDIeEm"
value_name = "B"
technology = "two-photon"
properties = ["cells", "movie", "3d", "tracked", "track-table", "real"]
note = "Real intravital two-photon movie, 1377 cells × 20 frames. NOT calibrated: µm == pixels here. Channels are ch0..ch3."

# A derived fixture: a temp copy of its base's project with `meta` written into the image's ccid.json
# (fixture_for does the copy). Real cells, a real calibration test, no committed bytes. Values are
# deliberately not 1 and z ≠ x, so a missing or swapped conversion shows.
[fixtures.KDIeEm-cal]
derive = "KDIeEm"
meta = { PhysicalSizeX = "0.5", PhysicalSizeY = "0.5", PhysicalSizeZ = "2.0", TimeIncrement = "30", TimeIncrementUnit = "s" }
properties = ["cells", "movie", "3d", "tracked", "track-table", "real", "calibrated"]
note = "KDIeEm with 0.5 × 0.5 × 2 µm and 30 s frames written into a temp copy's ccid.json meta. The real acquisition's calibration is unknown: these are chosen values."

[fixtures.CtMsh1]
dir = "CONTMESH/1/CtMsh1"
image_dir = "CONTMESH/0/CtMsh1"
value_name = "seg"
technology = "synthetic"
properties = ["cells", "still", "3d", "image-store", "label-store", "marker-names"]
note = "Six synthetic cubes (A / near / far) for the mesh contact route. x/y scale is 1.0 µm, so not `calibrated`."

[fixtures.ZV2img]
image_dir = "ZARRFMT/0/ZV2img"
technology = "two-photon"
properties = ["image-store", "calibrated", "movie", "3d", "real"]
note = "Real 64×64 crop, zarr v2. 0.5964 µm/px, 3 µm z, 30 s. No cells."

[fixtures.ZV3img]
image_dir = "ZARRFMT/0/ZV3img"
technology = "two-photon"
properties = ["image-store", "calibrated", "movie", "3d", "real"]
note = "The same crop as ZV2img, zarr v3 sharded. No cells."
