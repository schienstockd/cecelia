# Cecelia Feijoa — engine environment (Julia API + Python analysis stack).
#
# Pixi manages the **Python analysis env** that the whole engine uses (originally lived at
# `napari/.venv` from the R-Shiny era; the napari bridge is gone but the env is shared by cellpose,
# measure, btrack and the label-props writer). The env now lives at the repo-root `.pixi/`,
# not under `napari/`.
#
# Julia stays on juliaup + Manifest; Node stays on fnm. The single rule that makes this work:
# **run everything via `pixi run <task>`**. Pixi activates this env (prepends `.pixi/envs/.../bin`
# to PATH), so the Julia server's Python subprocesses pick up *this* `python3`. That is why no
# hardcoded env path lives in the Julia code anymore — see `python_bin_path()` (config default
# `"python3"`).
#
# Full rationale + non-obvious notes: docs/SHIPPING.md.

[workspace]
name = "cecelia-feijoa"
license = "GPL-3.0-or-later"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-arm64"]

# Pin `import cecelia` to THIS checkout's python/, for every `pixi run` in this project.
#
# `cecelia` is installed as an editable path dep (see [pypi-dependencies]), which setuptools implements
# as a meta-path finder holding ONE ABSOLUTE PATH. The pixi/uv cache keys that build on the RELATIVE
# `./python`, so the entry collides across git worktrees and the first checkout to build it wins: a
# worktree's own env can resolve `cecelia` into a DIFFERENT worktree, and nothing errors. Half the app
# then runs this checkout's files (everything launched by path — the preview worker, task runners)
# while importing another's library, until one side gains a helper the other lacks:
#
#   AttributeError: module 'cecelia.utils.correction_utils' has no attribute 'af_derived_values'
#
# PYTHONPATH is searched BEFORE the editable finder, so this makes the collision harmless rather than
# something each worktree has to be repaired out of. $PIXI_PROJECT_ROOT expands per project, so every
# worktree points at itself. Verified: re-breaking the finder no longer changes what imports.
#
# The launchers set it explicitly too (`run_py`, `preview.jl`) — that covers processes
# spawned by the Julia server, which do not go through `pixi run`. This covers the other direction:
# `pixi run test-py`, `pixi run python`, a REPL. Belt and braces, deliberately.
# Full write-up: docs/DEV.md → *A worktree's Python env can point at ANOTHER checkout*.
[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/python"

# Prefer the install's own juliaup (`<root>/juliaup`) for every task that runs bare `julia`. install.sh
# adds one for system scope and on Apple Silicon over an Intel Julia; without this, `pixi run stop`,
# `prod`, `doctor`, … from a terminal ran the user's Julia under Rosetta. No-op in a dev checkout.
# Unix only: Windows has no Rosetta case, and its system scope sets the env in its launcher.
[target.unix.activation]
scripts = ["scripts/activate_juliaup.sh"]

[dependencies]
python = "3.12.*"
openjdk = ">=17"
# cvxopt is a btrack dependency. PyPI ships no macOS-arm64 wheel for it, so a PyPI-only solve falls
# back to the sdist and tries to compile the UMFPACK extension — which needs SuiteSparse headers
# (umfpack.h) that aren't present on a stock Mac, breaking `pixi install`. Pin it from conda-forge
# (prebuilt on every platform) so it's never built from source; pixi maps it onto btrack's PyPI req.
cvxopt = ">=1.3.1"
# SimpleITK: the multi-modal (mutual-information) registration engine used by editImages.register
# (staining-cycle alignment) via the vendored sitkibex under python/sitkibex. Conda-forge builds it
# against the shared libitk, so this is one dep and one .so — a PyPI-only install would pull the
# ~200 MB monolithic wheel instead. Not needed by any other task, but the whole engine is one
# package (no per-module split), so this is the one line.
simpleitk = ">=2.3"
# pyproj (pulled transitively by squidpy) is the same story: PyPI has no osx-arm64 wheel for the
# resolved version, so a PyPI-only solve falls back to the sdist and tries to build pyproj against a
# system PROJ library that isn't on a stock Mac ("proj executable not found / PROJ_DIR"), breaking
# `pixi install` on macOS only. Pin it from conda-forge (which bundles PROJ) so it's prebuilt on
# every platform and pixi maps it onto squidpy's PyPI req.
pyproj = ">=3.7"

[pypi-dependencies]
# cecelia's own Python helpers (top-level python/, sibling to app/), installed editable. This ALSO
# pulls the IO tier (numpy, zarr>=3, dask, tifffile, ome-types, scipy, scikit-image, tqdm)
# transitively — those pins live in python/pyproject.toml, which owns the IO base so an external
# consumer (coastal) sees them via a plain `pip install cecelia`. This file therefore lists only the
# HEAVY / conda / per-platform deps; the IO tier is intentionally NOT duplicated here (Decision 2
# disjoint-sets split — every pin in exactly one file; see docs/todo/PY_PACKAGING_PLAN.md).
cecelia      = { path = "python", editable = true }
websockets   = ">=16.0"
# Movie writer backend for imageio.mimwrite/get_writer(fps=…). Was pulled in transitively via napari
# → napari-animation until P9; declared here now that napari is gone. Tests in test_movie_io.py
# encode short mp4s for real, so this needs to be present, not optional.
imageio-ffmpeg = ">=0.4"
# SPIKE (SHARED_RENDERER_PLAN Phase 0): run the viewer's WGSL headlessly.
wgpu         = ">=0.20"
# Cellpose lives in [feature.cellpose-v4] / [feature.cellpose-v3] below (two mutually-exclusive envs
# — same package name, incompatible major versions). Default env carries v4; the v3 env is an opt-in
# Mac-only sidecar for MPS speed. See docs/todo/CELLPOSE_V3_OPTIN_PLAN.md.
anndata      = ">=0.12"
scanpy       = ">=1.12"
pandas       = ">=2.3"
trimesh      = ">=4.0"
btrack       = ">=0.7"
# coastal (live-cell segmentation + the model-free smoothing engine used by
# cleanupImages.smooth). Pinned to a commit, but fetched as GitHub's source TARBALL for that
# commit, not as a `git` dep: a git dep makes pixi shell out to the system `git`, and on macOS that
# is Apple's shim, which exits 69 until the Xcode licence is accepted — and accepting it needs admin
# rights a lab Mac user often lacks. Over HTTPS nothing outside pixi is needed. To bump: replace the
# sha in the URL, `pixi lock`. See docs/SHIPPING.md.
# The dependency direction stays coastal -> cecelia at the *source* level (coastal imports
# cecelia's IO/napari helpers lazily); this entry is only cecelia consuming coastal's array-only
# algorithms, which import nothing from cecelia.
# The pinned sha is a HARD floor, not a snapshot: `segment.coastal` calls
# `flow_metrics_for_frame(flow_cache=..., window_offset=...)` (the optical flow two consecutive
# timepoints share — the kwargs are what make the cache reachable, and an older coastal raises
# TypeError on the first tile) and `LearnedAffinityInference(seed_blur_sigma=...)`,
# `opticalFlow.train` calls
# `train_with_metrics(val_frames=..., on_epoch=...)` and reads `history['floor_<term>']` (the
# `lossFloors` the convergence plot subtracts), `cleanupImages.smooth` calls
# `gated_frames`/`noise_sigma` for `temporalStat="gated"`, and the SUPPORT denoise path
# (`cleanupImages.denoise` + `opticalFlow.trainSupportDenoise`) calls `coastal.support.train_support`
# and `coastal.support.denoise_stack` (added when SUPPORT migrated OUT of cecelia's vendor tree into
# coastal — same pattern as CPnet). The current floor also has `train_support(on_batch_loss=..., ` `
# patience=..., min_delta=...)` (PRs #32 + #33, 2026-09-09) — the trainer_run passes both as kwargs,
# so an older rev raises TypeError. None of these exist before this commit.
# The floor also carries `match_masks_3d` giving one label to one object (coastal #34): an older rev
# reuses ids on a plane with no overlap to the one above, so two cells come back as one label.
# An older rev mostly fails at RUN time (TypeError), not at install — the Python tests stub coastal
# deliberately. The INSTALLED coastal is checked instead: `test_coastal_contract` checks the kwargs
# above by signature, `test_cellpose_stitch_ids` calls `match_masks_3d`, and `smooth_run.py` imports
# `gated_frames` at module scope so `test_smooth_runner` errors on load. Nothing catches a rollback
# past the floors (`history['floor_<term>']`), and it is silent: a rollback simply writes
# `lossFloors: {}`, which the panel treats as "this model predates floors" and greys the toggle
# out, so the feature disappears with no error anywhere.
coastal      = { url = "https://github.com/schienstockd/coastal/archive/fad40f2b8308c2f231454c29a1bc66f8f8e13ceb.tar.gz" }
# Leiden clustering (cells + tracks), CPU path. GPU (RAPIDS) is parked — see the gpu stub
# below and docs/todo/CLUSTERING_PLAN.md.
leidenalg    = ">=0.10"
# Multivariate matrix profile for sub-track behavioural motifs. See
# docs/todo/MOTIF_DISCOVERY_PLAN.md (P1 uses `stumpy.mstump` at windowSize=8, top_k=100). PyPI-only.
# Cite: Law (2019), JOSS 4(39):1504 https://doi.org/10.21105/joss.01504.
stumpy       = ">=1.13"
# Pairwise subsequence DTW on the top-K STUMPY survivors (P2, Decision 4). PyPI-only.
# Cite: Meert et al. (2020), dtaidistance https://doi.org/10.5281/zenodo.7158824.
dtaidistance = ">=2.3"
# MCP observer server (top-level mcp/ dir — read-only Claude access to a running project). Only the
# `mcp` run task needs it; the client + its tests are stdlib-only. See mcp/README.md, docs/ai-assist/OBSERVER.md.
mcp          = ">=2.2"
squidpy = ">=1.8.3, <1.9"
rtree = ">=1.4.1, <2"
pywavelets = ">=1.9.0, <2"
skan = ">=0.13.1, <0.14"
# Pure-Python Leica LIF reader. Used by /api/import/series/probe to enumerate a multi-series LIF and
# render per-series thumbnails BEFORE bioformats2raw conversion — so a user picking the last series
# of a 4-series file doesn't wait 30 s of JVM+convert just to see the picker (Bio-Formats' `showinf`
# and bf2raw both spin the JVM). Non-LIF multi-series formats (CZI/ND2/OIR) fall back to a
# name+dims list without a preview until an equivalent light reader lands. See probe_series_run.py.
# PyPI-only (not on conda-forge), so it lands here, not in [dependencies].
readlif = ">=0.6.5, <0.7"

# --- PyTorch: CUDA build on Linux/Windows, default (MPS/CPU) build on macOS -------------------
# The cu124 wheel index only carries linux/win wheels, so torch/torchvision MUST be declared
# per-platform — a global cu124 index would make macOS unsolvable. Keep torch and torchvision
# on the SAME index (they must match).
[target.linux-64.pypi-dependencies]
torch       = { version = ">=2.6", index = "https://download.pytorch.org/whl/cu124" }
torchvision = { version = ">=0.21", index = "https://download.pytorch.org/whl/cu124" }

[target.win-64.pypi-dependencies]
torch       = { version = ">=2.6", index = "https://download.pytorch.org/whl/cu124" }
torchvision = { version = ">=0.21", index = "https://download.pytorch.org/whl/cu124" }

[target.osx-arm64.pypi-dependencies]
# torch >= 2.7 is a HARD floor on Mac (both envs). CPSAM (v4) runs in bfloat16; older MPS builds
# raise `ERROR: BFloat16 is not supported on MPS` at inference time — see MouseLand/cellpose #1269
# + #1468, fixed in torch ~2.7 for inference (training got a float32 fallback via cellpose PR #1278,
# merged 2025-07-23). Also covers the v3 sparse-tensor NotImplementedError seen on torch 2.5.1 +
# cellpose 3.1.0 (#1063). Do NOT lower this pin — it removes a class of Mac-only silent crashes.
torch       = ">=2.7"
torchvision = ">=0.22"

# --- Cellpose v3 / v4 features + environments -------------------------------------------------
# v3 and v4 are the SAME PyPI package name with incompatible major versions, so they cannot
# resolve into one env. Split into two features; each env picks one. The default env is v4
# everywhere; `cellpose-v3` is an opt-in Mac-only sidecar because Cellpose-SAM (v4) runs slowly
# on MPS and the cellpose-3 CNN models (cyto2/cyto3) are ~10× faster there. See
# docs/todo/CELLPOSE_V3_OPTIN_PLAN.md.
#
# The v3 feature is scoped `platforms = ["osx-arm64"]` so a linux/win solve never tries to
# resolve it (v3 is not the answer to any perf problem on CUDA — MPS is the specific reason).
# Non-default environments are NOT installed by `pixi install`; users opt in via the in-app
# Install button (→ /api/system/envs/install), which shells `pixi install -e cellpose-v3`.

[feature.cellpose-v4.pypi-dependencies]
# Cellpose v4 (Cellpose-SAM). v4 has no `DenoiseModel` — the v3 pin used to keep
# `cleanupImages.cellposeCorrect` alive, and that task is retired: `cleanupImages.smooth`
# (coastal's model-free restorers) and `coastal.denoise` (the Cellpose-3 net re-implemented, no
# `cellpose` import) cover it. v4 also drops the cyto*/nuclei zoo for `cpsam_v2` and cannot load
# v3 checkpoints. See docs/todo/CELLPOSE_V4_PLAN.md and docs/SHIPPING.md.
cellpose = ">=4.2"

[feature.cellpose-v3]
# Mac-only: the whole point of this env is MPS speed on Apple Silicon; CUDA users are already
# fast on v4. Restricting the feature keeps a Linux/Windows `pixi install -e cellpose-v3`
# unsolvable rather than silently building a pointless env.
platforms = ["osx-arm64"]

[feature.cellpose-v3.pypi-dependencies]
# Cellpose 3.1 has native MPS support in cellpose.core (no monkey-patch, unlike the R-era
# `inst/patches/cellpose/core.py`). We ship the built-in `cyto2` + `cyto3` models — cellpose 3
# auto-downloads them to `~/.cellpose/models/` on first use; the install job pre-warms them.
cellpose = ">=3.1,<4"

[environments]
# Default: everything a normal `pixi install` / `pixi run <task>` gets. Base pypi-deps +
# per-platform torch + v4 cellpose.
default     = { features = ["cellpose-v4"] }
# Opt-in sidecar. `no-default-feature` defaults to `false`, so this env inherits the base
# [pypi-dependencies] (numpy, scipy, scikit-image, tqdm via cecelia's pyproject etc.) plus the
# osx-arm64 torch pin — only the cellpose spec differs. Not installed until explicitly asked.
cellpose-v3 = { features = ["cellpose-v3"] }

# --- Run templates (replace the old scripts/*.sh|.bat launchers) ------------------------------
# Launch everything via `pixi run <task>` so the activated env's python3 is what the Julia server's
# subprocesses and the napari bridge pick up. These are cross-platform — julia (juliaup), npm (fnm)
# and python3 (this env) all resolve on PATH; only the `stop*` tasks are OS-specific (see the
# [target.win-64.tasks] block below).
[tasks]
# Backend — Julia API server (port 8080). NB: api/src/*.jl are NOT Revise-tracked → restart for api edits.
# `-t auto` runs the API multithreaded: handlers run on the thread pool so a blocking HDF5 read no
# longer stalls the accept loop / a napari open, and the scheduler's per-image task functions
# (Threads.@spawn) actually parallelise. Julia HDF5 is serialised via `_with_h5`; shared API state is
# lock-guarded. Override with JULIA_NUM_THREADS if you want a fixed count.
# Do NOT pin the supervisor's thread count. `-t 1` looks harmless (it only spawns and waits) and was
# measured to BREAK Ctrl-C outright: at one thread, Julia 1.12 does not deliver SIGINT to a process
# blocked in `wait` at all — it is simply ignored, so `supervise()`'s teardown never runs. Leave the
# default. See docs/DEV.md → *Stopping the app*.
dev  = { cmd = "julia --project dev.jl", cwd = "api", env = { CECELIA_DEV = "1", CECELIA_SUPERVISED = "1" } }  # dev.jl supervises BOTH the Revise hot-reload backend AND the frontend (Vite) — relaunches them on Settings→System Restart/worktree-switch. So `pixi run dev` now starts the frontend too; don't also run `pixi run frontend` alongside it. CECELIA_DEV marks a dev server (prod/app.py never sets it → auto-detected); CECELIA_SUPERVISED enables the backend Restart button
prod = { cmd = "julia --project -t auto src/server.jl", cwd = "api" }                                    # plain include (production)
# The detached task runner (:7657) — the process that owns the resource pools and executes tasks, so a
# backend restart doesn't kill work in flight. `pixi run dev` launches/adopts it itself when
# CECELIA_RUNNER=1 (`dev-runner`); this standalone task is for starting it BEFORE the backend, or
# leaving it up across a `stop-backend`. See docs/todo/TASK_RUNNER_PLAN.md.
runner     = { cmd = "julia --project -t auto runner.jl", cwd = "api" }
dev-runner = { cmd = "julia --project dev.jl", cwd = "api", env = { CECELIA_DEV = "1", CECELIA_SUPERVISED = "1", CECELIA_RUNNER = "1" } }

# Tests — one whole suite per layer. Package (headless Cecelia) + API adapters (loaded with
# CECELIA_NO_SERVE — no socket bound) + frontend (Vitest, pure logic from src/utils/*) + Python
# analysis-env (unittest-discovered python/cecelia/tests/*, e.g. the zarr writer) + MCP observer
# client (stdlib unittest, mocked HTTP). All run in CI.
# -O0: test bodies run ONCE, so paying LLVM to optimise them is pure waste — it was ~2/3 of the
# suite's wall time. Cecelia's own methods come from the -O2 pkgimage built at install, so the code
# under test is unaffected; only code compiled in-session (the test file) drops to -O0. Measured
# 202s → 69s locally, same 2513 assertions. See app/test/suite.jl for the other half of the fix.
test-pkg      = { cmd = "julia -O0 --project test/runtests.jl", cwd = "app" }
test-api      = { cmd = "julia -O0 --project test/runtests.jl", cwd = "api" }   # same reason as above — measured 67s → 42s
# Detached-task-runner end-to-end: launches a REAL second Julia process. NOT in test-pkg — it pays a
# full child start-up + precompile, which is minutes on a cold depot. Run it when touching app/src/runner/.
test-runner   = { cmd = "julia --project test/runner_e2e.jl", cwd = "app" }
test-frontend = { cmd = "npm test", cwd = "frontend" }
test-py       = { cmd = "python -m unittest discover -s python/cecelia/tests -p 'test_*.py' -v" }
test-mcp      = { cmd = "python -m unittest discover -s tests -t . -v", cwd = "mcp", env = { PYTHONPATH = "." } }

# MCP observer server (stdio) — read-only Claude access to the running project (needs `pixi run dev`
# on :8080). See mcp/README.md for wiring into Claude Code. Override the API with CECELIA_API_URL.
mcp           = { cmd = "python -m cecelia_mcp.server", cwd = "mcp", env = { PYTHONPATH = "." } }

# Frontend — Vite (port 5173). NOTE: `pixi run dev` already starts this; run it standalone ONLY when
# not using `pixi run dev` (e.g. previewing another worktree on a spare port), else two Vites clash.
frontend = { cmd = "npm run dev", cwd = "frontend" }    # dev server, hot reload
build    = { cmd = "npm run build", cwd = "frontend" }  # static production build

# Task-preview worker (port 7656) standalone — normally the backend launches it on the first preview;
# run this to debug it alone. Resident because a process that can segment costs 17.7s of imports before
# it can answer (measured), which is fatal per preview and irrelevant once. PYTHONPATH so it resolves
# `import cecelia.*` the same way run_py sets it up for task runners.
preview = { cmd = "python3 preview_worker.py", cwd = "preview", env = { PYTHONPATH = "python" } }

# Headless task console — read-only live view of scheduler tasks over the server's WebSocket.
# Reporting only (no run/cancel); safe alongside the GUI. `-- --stream` for append-only log output.
console = { cmd = "julia --project task_console.jl", cwd = "api" }

# Notebook Playground (Pluto, port 7660) — pure-Julia downstream analysis. Runs its OWN Julia
# session (the pluto/ env path-sources Cecelia), NOT the API server. Point it at a project's
# notebooks via CECELIA_NOTEBOOKS_DIR; defaults to the shipped examples in notebooks/. The server
# launches WITHOUT a sysimage (it's just Pluto); notebook WORKERS pick up pluto/deps.so if built
# (see notebooks-sysimage) — that's what kills Makie's ~20s time-to-first-plot. See
# docs/todo/NOTEBOOK_PLAYGROUND_PLAN.md.
notebooks = { cmd = "julia --project launch.jl", cwd = "pluto" }
# Build the deps-only sysimage (Makie/CairoMakie + AoG + DataFrames + HDF5 + HTTP; NOT Cecelia, so
# Revise still hot-reloads it). ~10 min, ~1.4 GB, one-time; pluto/deps.so is git-ignored. DEV build.
notebooks-sysimage = { cmd = "julia --project build_sysimage.jl", cwd = "pluto" }
# RELEASE build: same, but also bakes in Cecelia + CeceliaNb (code frozen) for near-instant first
# plot AND first pop_df. Wired into the packaging flow — see docs/SHIPPING.md. Also → pluto/deps.so.
notebooks-sysimage-full = { cmd = "julia --project build_sysimage_full.jl", cwd = "pluto" }
# Resolve + install the pluto env (its own manifest — like julia-instantiate for app/). `resolve`
# FIRST is deliberate: the pluto env path-sources Cecelia (../app), so when a new Julia dep is added
# to app/Project.toml, plain `instantiate` honours the stale manifest and never picks it up — the
# notebook then fails to precompile ("Cecelia does not have <Dep> in its dependencies"). `resolve` is
# a no-op when already consistent and self-heals the manifest when it isn't. Same for julia-instantiate.
notebooks-instantiate = { cmd = "julia --project -e 'using Pkg; Pkg.resolve(); Pkg.instantiate()'", cwd = "pluto" }

# One-click launch (the desktop-shortcut entrypoint): start the prod server, wait for /api/health,
# open the default browser at :8080. The Julia server serves the built frontend, so run `build` first.
app = "python app.py"

# Fetch custom cellpose checkpoints (schienstockd/ceceliaModels → <repo>/models/cellposeModels/).
# `--ref` and `--dest` override the branch + target dir. See docs/SEGMENTATION.md → Custom
# cellpose checkpoints. NOTE: everything currently in that repo is a cellpose 3 checkpoint, which
# cellpose 4 refuses to load — the installers no longer run this, and it is kept for whenever there
# is a v4 set to distribute. Not in git either way — see .gitignore /models/.
models-fetch = "python scripts/models_fetch.py"

# Dump every front-facing string (SFCs + task specs + Julia QC text) to UI_COPY_INVENTORY.md, with
# the drift signals over it — capitalisation, duplicate phrasings, competing verbs. For READING the
# app's language end-to-end; the build-failing subset is the ratchet in uiCopy.test.ts +
# app/test/runtests.jl. Parsing lives in frontend/src/utils/uiCopy.ts. See docs/UI.md → UI copy.
ui-copy = "node scripts/ui_copy_inventory.mjs"

# Rebuild frontend/src/icons.css (the vendored Lucide glyphs) from the `lucide` names in
# frontend/src/lib/iconLegend.ts. Run after adding or changing a glyph; iconLegend.test.ts fails
# until you do. Fetches the pinned lucide-static tarball (network). See scripts/vendor_icons.mjs.
icons = "node scripts/vendor_icons.mjs"

# Read ~/.cecelia-effectiveness/events.jsonl (or $CECELIA_EFFECTIVENESS_LOG) and rewrite
# docs/ai-assist/EFFECTIVENESS.md — the public rollup of the AI-assist infrastructure's catch/FP
# numbers. On-demand only; never auto-committed. Review the diff, commit if the update is
# meaningful. Package: python/cecelia/effectiveness/. Design: docs/todo/EFFECTIVENESS_LOG_PLAN.md.
audit-rollup = "python scripts/audit_rollup.py"

# Spawn both reviewers (fanout audit + convention check), emit `_run` events to the log, and
# print the formatted recital body to stdout. The one-command replacement for the manual
# "agent spawns two subagents, formats findings, emits events" protocol. Agent captures stdout
# and appends to the commit message. See CLAUDE.md → Git & commits.
recital = "python scripts/recital.py"

# Live console for the effectiveness log — the recital-side twin of `pixi run console`
# (which watches scheduler tasks). TTY: full-screen dashboard with per-mechanism counters
# (runs, findings by marker, resolved by outcome), a recent-findings pane with the wrapped
# description of each flag, and an activity stream at the bottom. Pipe / --stream: append-only
# formatted event log so `... | tee out.log` gives a clean file. Reads
# ~/.cecelia-effectiveness/events.jsonl (or $CECELIA_EFFECTIVENESS_LOG). `-- --no-follow` for
# a one-shot snapshot; `-- --tail 0` seeds from the whole history; `-- --since 24h` seeds
# from the last day; `-- --width COLS` overrides the wrap column.
recital-console = "python -m cecelia.effectiveness.console"

# Agent overnight run (docs/todo/AGENT_OVERNIGHT_PLAN.md): build an isolated fixture project
# (synthetic, or a crop of an analysed image), run the hand-tuned ceiling pipeline, score a run.
# Run inside pixi so task subprocesses get this env's python. Spawn no agents.
agent-eval-setup   = "python scripts/agent_eval/setup.py"
agent-eval-crop    = "python scripts/agent_eval/crop.py"
agent-eval-ceiling = "julia --project=app scripts/agent_eval/ceiling.jl"
agent-eval-score   = "python scripts/agent_eval/score.py"
# Spawns ONE sandboxed `claude -p` (unless --dry-run) — cost capped by --budget-usd (default $10).
agent-eval-run     = "python scripts/agent_eval/run_overnight.py"
# An agent follows one in-app guide against the RUNNING app (docs/todo/GUIDE_RUNS_PLAN.md):
# `guide-run <guide> [--runs N] [--at HH:MM] [--knowledge]`. Spends real money, ≤ $5 per run.
guide-run          = "python scripts/agent_eval/guide_run.py"

# The weekly judge (docs/ai-assist/WEEKLY_JUDGE.md): pin origin/main, sweep the reviewer findings
# nobody fixed, verify the open ones with sandboxed read-only agents, tally which CLAUDE.md rules
# keep breaking, write the run record, mirror the bugs to issues and comment on the status issue (a PR
# only for rule proposals; `-- --no-issues` for the old record PR). Real API spend, capped (~$14). The
# Tuesday timer runs it; `-- --no-pr` skips the PR, `-- --dry-run` prints the record.
judge-weekly = "python scripts/judge/weekly.py"
# The pieces on their own, printed, never written: the bug sweep (one judge call; `--no-judge` is
# free), verify a record's bugs (`--date D`, spends up to `--cap`), the rule tally (one judge call).
judge-bugs   = "python scripts/judge/bugs.py"
judge-verify = "python scripts/judge/verify.py"
judge-rules  = "python scripts/judge/rules.py"
# The agent run reviews a pass would log (guide / platform causes) and its agent causes per guide,
# printed; reads the run harness's projects dir (`--projects-dir D`), logs nothing.
judge-run-reviews = "python scripts/judge/run_reviews.py"
# Re-render a stored run record's markdown (`judge-record D [--mirror]`). Spawns nothing.
judge-record = "python scripts/judge/record.py"
# The owner's queue for the newest run record: the bugs a verify agent sent you (`decide`). One key
# per answer (open / wont_fix); answers are append-only events in ~/.cecelia-effectiveness/review.jsonl,
# applied by the next pass. `--date D` for another record.
judge-review = "python scripts/judge/review.py"
# The GitHub issue mirror for the newest run record (docs/todo/JUDGE_WORKFLOW_PLAN.md D7): what it
# would file, close and reopen, printed with every body; reads only the judge issues' numbers and
# states. `-- --apply` does it and records the issue numbers. The weekly pass runs it unless `--no-issues`.
judge-issues = "python scripts/judge/issues.py"

# Rehearse a release bundle: pack what release.yml packs, extract it to a temp dir, and check that
# everything the running app loads is in there. `--launch` also boots the API server from the
# extracted tree (isolated config dir, :8099 — never 8080) and waits for /api/health, which is the
# check that catches a load-time `include` of a file the bundle forgot (#540). Unix only; the
# Windows equivalent is running the same steps by hand. See docs/SHIPPING.md → Building & releasing.
bundle-check = "bash scripts/bundle_check.sh"

# Update the env to the latest versions allowed by pixi.toml (console update path; the in-app
# "Update" button hits /api/update, which runs the same). Refreshes pixi.lock.
update = "pixi update"

# Julia package deps. `resolve` first (self-heals a manifest that's missing a newly-added dep — see
# notebooks-instantiate); a no-op when already consistent.
julia-instantiate = "julia --project=app -e 'using Pkg; Pkg.resolve(); Pkg.instantiate()'"

# `Pkg.update()` the app, api and pluto envs together, within [compat], and print a markdown table of
# what moved. The Julia half of .github/workflows/update-deps.yml. See docs/todo/DEPS_UPDATES_PLAN.md.
update-julia = "julia --startup-file=no scripts/update_julia_envs.jl"

# Fresh-clone / new-worktree audit — dispatcher over existing checks (Design pattern adapted from
# spaCR — see THIRD_PARTY.md → Design patterns adopted). Auto-fixes cheap things (npm ci, etc.);
# pass `--check` for report-only. Non-zero exit on any red row so CI/install wrappers can gate.
doctor = "julia --startup-file=no scripts/doctor.jl"

# Create a fully bootstrapped sibling worktree — `git worktree add` + `.env` copy + a fresh
# per-worktree `pixi install`, then delegates `.env`/frontend/deps verification to `pixi run
# doctor` in the new tree (which auto-fixes npm ci). Bootstrap owns only what doctor cannot do
# (no tree to audit yet, no source to copy `.env` from, no per-worktree `.pixi` yet).
# Usage: `pixi run bootstrap-worktree <name> [<branch>] [<ref>]`. See docs/DEV.md → Creating a
# new worktree.
bootstrap-worktree = "julia --startup-file=no scripts/bootstrap_worktree.jl"

# Activate the tracked git hooks (`.githooks/commit-msg` — recital outcome-tag gates + log
# resolution rows). Once per clone: `core.hooksPath` lives in the shared `.git/config`, so every
# worktree picks it up and runs its own checkout's copy. The Claude Code Bash guard blocks
# commits until it's set. See `.claude/hooks/check_commit_recital.py`.
install-git-hooks = "git config core.hooksPath .githooks"

# Stop by PORT, not by process name — killing by name self-matches the task's own shell and was
# orphaning long-lived children (originally the napari bridge; see docs/SHIPPING.md).
#
# All five delegate to `api/portkill.jl`, which is ONE cross-platform implementation instead of the
# three per-OS shell variants (lsof / PowerShell / ss) these used to carry — 18 one-liners that had to
# be kept in step by hand. Two things that shell could not do, and both were real bugs:
#
#   • It sent ONE SIGTERM and then echoed "stopped …" unconditionally. A Julia server whose worker
#     threads are mid-compile does not die on SIGTERM — it prints every thread's backtrace and keeps
#     running — so `pixi run stop` reported success while :8080 was still held and the next
#     `pixi run dev` could not bind. portkill.jl escalates to SIGKILL and CONFIRMS the port is free,
#     and says "STILL RUNNING" (exit 1) when it isn't, rather than lying.
#   • The lsof variant hung indefinitely on any process stuck in D (uninterruptible) sleep, because
#     lsof walks every process's /proc/<pid>/fd table. portkill.jl uses `ss` on Linux for that reason
#     and puts a watchdog around every probe.
#
# It restricts to LISTENING sockets throughout: a browser tab and its Vite HMR socket are CONNECTED to
# :5173, and killing those reaps Firefox/Chrome. Base-only Julia (no `--project`), so it still works
# when the env or a manifest is half-installed — which is exactly when you reach for `stop`.
# Services, not port numbers: portkill.jl maps each to THIS user's port slot (app/src/ports.jl), so a
# stop never aims at another user's Cecelia on the same machine.
stop           = { cmd = "julia --startup-file=no portkill.jl backend frontend preview runner notebooks", cwd = "api" }
stop-backend   = { cmd = "julia --startup-file=no portkill.jl backend",       cwd = "api" }
stop-preview   = { cmd = "julia --startup-file=no portkill.jl preview",       cwd = "api" }
stop-runner    = { cmd = "julia --startup-file=no portkill.jl runner",        cwd = "api" }
stop-notebooks = { cmd = "julia --startup-file=no portkill.jl notebooks",     cwd = "api" }

